id: nyc_park_cooling_effect__buffer_gradient_analysis_e6e967
name: How effectively do urban parks cool their surroundings?
description: 'Composed by wonder from curiosity ''park_cooling_effect'' and method
  ''buffer_gradient_analysis'' for plot ''nyc''. The door does not lock: this runs
  as composed so its limits can be discovered honestly.'
curiosity:
  ref: $curiosity-space/thermal/park_cooling_effect
method:
  ref: $methods/thermal/buffer_gradient_analysis
city: nyc
manifest: plots/nyc/manifest.yml
choices:
  intensity_measure: TPM-M
  central_tendency: median
  buffer_interval: default
  max_buffer_distance: default
parameters:
  target_crs: EPSG:4326
steps:
- id: conform_feature_boundaries
  primitive: soil/validate_vector
  inputs:
    features: $manifest.park_boundaries
  outputs:
    validated: feature_boundaries_validated
  params: {}
- id: conform_feature_boundaries_frame
  primitive: soil/reproject_vector
  inputs:
    features: $steps.conform_feature_boundaries.validated
  outputs:
    reprojected: feature_boundaries_reprojected
  params:
    target_crs: EPSG:4326
- id: conform_surface_temperature
  primitive: soil/validate_raster
  inputs:
    features: $manifest.land_surface_temperature
  outputs:
    validated: surface_temperature_validated
  params: {}
- id: analyze
  primitive: roots/geometry/generate_buffers
  description: Create concentric ring geometries around features
  inputs:
    feature_boundaries: $steps.conform_feature_boundaries_frame.reprojected
    surface_temperature: $steps.conform_surface_temperature.validated
  outputs:
    buffer_zones: buffer_zones
    zonal_temperatures: zonal_temperatures
    cooling_intensity: cooling_intensity
  params: {}
