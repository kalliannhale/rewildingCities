# ============================================================================
# plots/maine/experiments/maine_county_indicator_standings.yml
# ============================================================================
# the county standings for two CII indicators of basic needs: rent burden and
# households without a vehicle, the curiosity's rent_burden and
# vehicle_access sub-questions, answered in one run because both read the
# same national acquisition and the same reference population.
#
# broadband is not here. its standing answers a different question
# (broadband_access), and the composed experiment
# maine_broadband_access_subscription__cii_indicator_values_91b5c0 already
# answers it, with the same method and the same choices. one experiment per
# question, so no receipt borrows a question it does not answer and no
# standing is computed twice.
#
# the reference population is the nation's 3,144 counties (50 states and DC);
# Puerto Rico's 78 municipios keep their rows with no standing, by
# declaration. a Maine-only percentile would be a different claim with the
# same name.
# ============================================================================

id: maine_county_indicator_standings
name: "Maine's counties among the nation's, on rent burden and vehicle access"
description: >
  Derives rent burden and households without a vehicle for every U.S.
  county from ACS 2020-2024, then places each county among the nation's
  3,144 by CII's percentile rule.

curiosity:
  ref: $curiosity-space/information/basic_needs_and_opportunity

method:
  ref: $methods/information/cii_indicator_values

city: maine
manifest: ../manifest.yml

choices:
  sd_convention: sample
  reference_population: nation_50_states_dc
  aggregation_unit_level: county

parameters: {}

steps:
  - id: county_derive
    primitive: soil/derive_indicator
    description: "Indicator values for every U.S. county"
    inputs:
      source: $manifest.acs_us_county_2024
    outputs:
      values: indicator_values
    params:
      indicators:
        - $indicators.cii_rent_burden
        - $indicators.cii_no_vehicle
      spatial_unit: $choices.aggregation_unit_level
      time: 2020-2024 (5-year estimates)
      published_by: us_census_acs
      # whose codes name the units (D-131)
      unit_authority: us_census_geoid
      unit_column: GEOID
      name_column: NAME
      joins_to: governance_unit

  - id: county_standardize
    primitive: roots/standardize_indicator
    description: "Each county placed among the nation's"
    inputs:
      values: $steps.county_derive.values
    outputs:
      standings: indicator_standings
    params:
      indicators:
        - $indicators.cii_rent_burden
        - $indicators.cii_no_vehicle
      sd: $choices.sd_convention
      exclude_state_fips:
        - '72'
