# ============================================================================
# plots/maine/preparations/maine_health_centers.yml
# ============================================================================
# a preparation (D-98): Maine's health center sites as carriers (Sprint 06,
# step 3, the third carrier). what is placed and why: the
# health_center_carriers method (D-212).
#   HRSA's sites file  -> sites as points; every unplaced site listed with why
#   the points         -> located_in edges
#   the edges          -> health center sites per 1,000 people, every place
# the spine, places and divisions are read through loam ($loam., LOAM-1), so
# they are judged fresh before any step runs (D-166).
# how HRSA's file is read (the columns read, and its codes) is national, so
# it is a crosswalk every plot shares, seeds/crosswalks/health_centers/
# hrsa_health_center_sites.yml, never written here (D-226).
# the copy's encoding and day are its own facts, declared with
# hrsa_health_center_sites_20261114 in the manifest (source.sites_encoding,
# source.sites_snapshot_date); the orchestrator refuses a run that disagrees
# (D-192), and the primitive refuses a copy whose rows carry another day.
# no located_in block check: the file carries no Census block.
# ============================================================================

id: maine_health_centers
name: "Maine's health center sites, placed"
kind: preparation
description: >
  Places every health center site HRSA lists in Maine in each area it falls
  in, and lists the sites that are not placed, each with its reason.

method:
  ref: $methods/information/health_center_carriers

city: maine
manifest: ../manifest.yml

choices: {}
parameters: {}

steps:
  - id: health_centers_points
    primitive: soil/prepare_health_center_points
    inputs:
      snapshot: $manifest.hrsa_health_center_sites_20261114
    outputs:
      points: health_center_site
    params:
      encoding: utf-8
      snapshot_date: "2026-11-14"
      state: ME
      state_fips: "23"
      reading: $crosswalks.hrsa_health_center_sites

  - id: health_centers_located_in
    primitive: soil/build_located_in
    inputs:
      points: $steps.health_centers_points.points
      faces: $manifest.faces_2024_me
      spine: $loam.block_spine
      places: $loam.places
      divisions: $loam.block_division_assignment
    outputs:
      edges: located_in_edges
    params:
      # the edges' label: whose points and which day's copy. the indicator
      # counts health_center_site, the points' type; the orchestrator checks
      # the two agree before the run (D-224)
      layer: hrsa_hcsd_20261114_health_center_sites
      id_field: feature_id
      state_fips: "23"
      vintages:
        state: "2024"
        county: "2024"
        town: "2024"
        sldl: "2024"
        sldu: "2024"
        aiannh: "2020"
        division: "MEGIS METWP24P"

  - id: health_centers_counts
    primitive: soil/count_located
    inputs:
      edges: $steps.health_centers_located_in.edges
      spine: $loam.block_spine
      places: $loam.places
    outputs:
      values: indicator_values
    params:
      indicator: $indicators.health_center_sites_per_1000
      levels: [state, county, cousub, sldl, sldu]
      # the day HRSA's copy describes. which boundaries the count sits on
      # travels in each row's boundary_vintage, from the edges (D-231)
      time: "2026-11-14"
      published_by: rewildingcities
