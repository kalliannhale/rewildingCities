# ═══════════════════════════════════════════════════════════════════════════════
# CURIOSITY SCHEMA v1.1
# A curiosity declares what we want to know — domain-specific but method-agnostic.
# Pure inquiry, no implementation details.
# seeds/schemas/curiosity.schema.yml
#
# v1.1 (2026-10-08): declares two fields already in use, so neither passes
# silently: `compatible_methods`, which possibility.py reads to bind methods,
# and `indicated_by` on sub-questions, which names the indicators that answer
# them. The schema stays open (no additionalProperties: false), because
# existing curiosities carry fields such as `references` that are not yet
# declared; closing it is a separate decision.
# ═══════════════════════════════════════════════════════════════════════════════

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://rewilding.city/schemas/curiosity.schema.json"
title: "Curiosity"
description: >
  Research questions that articulate what we want to know without prescribing
  how to answer. The root of the scientific model — curiosity drives everything.

type: object
required: [id, question]

properties:

  # ───────────────────────────────────────────────────────────────────────────
  # IDENTITY
  # ───────────────────────────────────────────────────────────────────────────
  id:
    type: string
    pattern: "^[a-z0-9_]+$"
    description: Machine-readable identifier
    examples: ["park_cooling_effect", "green_infrastructure_equity"]

  domain:
    type: string
    enum: [thermal, landscape, hydrology, biodiversity, equity, air_quality, perception, policy, information]
    description: Scientific domain this curiosity belongs to

  tags:
    type: array
    items:
      type: string
    description: Tags for discovery and organization
    examples:
      - "climate_resilience"
      - "public_health"
      - "environmental_justice"
      - "perception"
      - "biodiversity"
      - "land_cover"
      - "equity"
      - "legislation"
      - "information"

  # ───────────────────────────────────────────────────────────────────────────
  # THE QUESTION
  # ───────────────────────────────────────────────────────────────────────────
  question:
    type: string
    description: >
      The central research question, stated plainly. Should be answerable
      through empirical analysis but not prescribe a specific method.
    examples:
      - "How effectively do urban parks cool their surroundings?"

  description:
    type: string
    description: >
      Extended narrative explaining the curiosity, its context, and why
      it matters. This is where the question comes alive.

  significance:
    type: string
    description: >
      Why this question matters. What decisions or understanding does it inform?

  # ───────────────────────────────────────────────────────────────────────────
  # SUB-QUESTIONS
  # ───────────────────────────────────────────────────────────────────────────
  sub_questions:
    type: object
    description: >
      Decomposition of the main question into specific, addressable parts.
      Keys are identifiers used in experiment references.
    additionalProperties:
      type: object
      required: [question]
      properties:
        question:
          type: string
          description: The sub-question itself
        description:
          type: string
          description: Additional context or clarification
        interpretation:
          type: string
          description: How to interpret answers to this sub-question
        depends_on:
          type: array
          items:
            type: string
          description: Other sub-questions this one builds on
        answers_for:
          type: array
          items:
            type: string
          description: What use cases this sub-question serves
        indicated_by:
          type: array
          items:
            type: string
            pattern: "^[a-z0-9_]+$"
          description: >
            Indicator ids from seeds/indicators/ that answer this sub-question.
            Several ids for one sub-question are several authorities or
            derivations of the same claim, held side by side and never
            averaged. A curiosity stays method-agnostic: an indicator names
            what is measured, not how an experiment computes it.
          examples:
            - ["cii_broadband", "cii_pub_broadband"]

  # ───────────────────────────────────────────────────────────────────────────
  # METHODS THAT COULD ANSWER IT
  # ───────────────────────────────────────────────────────────────────────────
  compatible_methods:
    type: array
    description: >
      The methods that could answer this curiosity, each with how well it fits.
      An EMPTY list declares that no method answers this yet, and wonder says
      so. OMITTING the field means the curiosity names no methods, and wonder
      falls back to every method in its domain. The two are different claims
      and are never read as the same one.
    items:
      type: object
      required: [ref, fit]
      properties:
        ref:
          type: string
          pattern: "^\\$methods/[a-z_]+/[a-z0-9_]+$"
          description: >
            The method, as $methods/<domain>/<method_id>, where method_id is
            the method's `id` as listed in garden/methods/index.yml, never its
            file name. The two can differ: buffer_gradient_analysis lives in
            thermal_gradient_analysis.yml, and possibility.py finds methods by id.
          examples: ["$methods/thermal/hot_cold_spot_analysis", "$methods/thermal/buffer_gradient_analysis"]
        fit:
          type: string
          enum: [direct, complementary, partial]
          description: >
            direct: answers the curiosity's central question. complementary:
            follows up on or deepens a direct answer. partial: answers some
            sub-questions and not others; name them in sub_questions.
        description:
          type: string
          description: What this method contributes to this question, said to a person
        sub_questions:
          type: array
          items:
            type: string
          description: >
            Keys of the sub-questions this method addresses. Omitted means all
            of them. Each must be a key of this curiosity's sub_questions,
            which a JSON schema cannot check and the loader should.

  # ───────────────────────────────────────────────────────────────────────────
  # CONTEXT
  # ───────────────────────────────────────────────────────────────────────────
  related_phenomena:
    type: array
    items:
      type: string
    description: Related concepts, effects, or processes
    examples:
      - "urban_heat_island"
      - "evapotranspiration"
      - "thermal_comfort"

  foundational_research:
    type: array
    items:
      type: object
      required: [citation]
      properties:
        citation:
          type: string
          description: Full citation
        contribution:
          type: string
          description: What this research established and how it informs the curiosity
    description: Key papers or studies that inform this question

  # ───────────────────────────────────────────────────────────────────────────
  # METADATA
  # ───────────────────────────────────────────────────────────────────────────
  version:
    type: string
    description: Version of this curiosity document
    default: "1.0.0"

  created:
    type: string
    format: date
    description: When this curiosity was first articulated

  contributors:
    type: array
    items:
      type: string
    description: People who contributed to formulating this question