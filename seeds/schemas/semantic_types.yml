# ═══════════════════════════════════════════════════════════════════════════════
# seeds/schemas/semantic_types.yml
# BASE vocabulary: types reused across every domain.
#
# Domain-specific types live in seeds/schemas/domains/<domain>.yml and are
# merged on top of this file at load time. The loader stamps each type's
# `domain` from its source (base here; the filename stem for domain files) and
# errors loudly on any cross-file name collision. Names stay flat.
# ═══════════════════════════════════════════════════════════════════════════════

types:

  # ----- vector -----

  study_area:
    category: vector
    format: geojson
    resolution_tier: public   # PROPOSED (Sprint 03, D-118): environmental or analytical, no people's own information. For Person 3 to confirm
    description: Boundary defining the extent of analysis.

  study_boundary:
    category: vector
    format: geojson
    resolution_tier: public   # PROPOSED (Sprint 03, D-118): environmental or analytical, no people's own information. For Person 3 to confirm
    description: >
      Boundary polygon defining the spatial extent of analysis. May be a city
      boundary, neighborhood, watershed, or any user-defined area of interest.

  city_boundary:
    category: vector
    format: geojson
    resolution_tier: public   # PROPOSED (Sprint 03, D-118): environmental or analytical, no people's own information. For Person 3 to confirm
    description: >
      Administrative boundary of a city or municipality. Commonly used as the
      study boundary for city-wide analyses.

  neighborhood_boundaries:
    category: vector
    format: geojson
    resolution_tier: public   # PROPOSED (Sprint 03, D-118): environmental or analytical, no people's own information. For Person 3 to confirm
    description: >
      Neighborhood polygons within a city. Usually a statistical unit drawn
      for tabulation (New York's Neighborhood Tabulation Areas), not a
      government: nobody governs it, and it is no unit of accountability.
      Where a neighborhood truly governs, it is a governance_unit.

  buffer_zones:
    category: vector
    format: geojson
    resolution_tier: public   # PROPOSED (Sprint 03, D-118): environmental or analytical, no people's own information. For Person 3 to confirm
    description: Buffer rings with parent association removed (donut shapes).

  clipped_features:
    category: vector
    format: geojson
    resolution_tier: public   # PROPOSED (Sprint 03, D-118): environmental or analytical, no people's own information. For Person 3 to confirm
    description: Features clipped to a study boundary.

  census_block_counts:
    category: tabular
    format: parquet
    description: >
      2020 Census tabulation blocks with their redistricting counts (P.L.
      94-171): P1_001N persons, H1_001N housing units, H1_002N occupied units,
      which are households. The weights of every overlaps edge (D-121).
    resolution_tier: public   # PROPOSED (Sprint 04): Census counts, U.S. government work. For Person 3 to confirm

  census_block_points:
    category: vector
    format: geojson
    description: >
      2020 Census tabulation blocks as their internal points (INTPTLAT,
      INTPTLON), from the Census 2020 block layer, never the current one: the
      block equivalency files use original 2020 blocks. Geometry may be null;
      the point is in the attributes.
    resolution_tier: public   # PROPOSED (Sprint 04): Census geography. For Person 3 to confirm

  census_subdivisions:
    category: tabular
    format: zip
    description: >
      A state's TIGER/Line county subdivisions for one vintage, as the Census
      publishes them (tl_<year>_<state>_cousub.zip). Read for its attributes
      only: GEOID, NAMELSAD, LSAD and FUNCSTAT, which say what each town is
      and the Census's status for it (D-128).
    resolution_tier: public   # PROPOSED (Sprint 04): Census files. For Person 3 to confirm

  places:
    category: tabular
    format: parquet
    description: >
      The geography graph's places (Contract 3): one row per place at every
      level, keyed by (authority, code), with its kind, the Census's own
      status, its flags and the context note that must travel with it.
    resolution_tier: public   # PROPOSED (Sprint 04): built from public Census and MEGIS data
    # the note's text lives in seeds/notes/notes.yml (D-157); each row's own
    # note is in its context_note column and travels by row (D-156, D-158)
    required_context:
      - id: census_tribal_places

  census_faces:
    category: tabular
    format: zip
    description: >
      Census TIGER/Line topological faces for one or more counties: the polygon
      pieces that make up every 2020 block, each carrying its 2024 county
      subdivision, House and Senate district (D-126, TOWN-1). Read from the zip
      it arrives in; geometry is never read, only the .dbf attributes.
    resolution_tier: public   # PROPOSED (Sprint 04): Census files. For Person 3 to confirm

  block_assignment:
    category: tabular
    format: csv
    description: >
      A Census file assigning each 2020 block to a unit: a county subdivision,
      a tribal area, a legislative district. Read from the zip it arrives in.
    resolution_tier: public   # PROPOSED (Sprint 04): Census files. For Person 3 to confirm

  census_tribal_area:
    category: vector
    format: geojson
    description: >
      A federal American Indian reservation or off-reservation trust land, as
      the Census Bureau records it (D-123). The Census's legal areas only;
      its statistical areas are not used. Not the nations' own description of
      their lands, which is `sovereign_boundary` and leaves only with consent.
    resolution_tier: public   # D-123: a qualified Census view (MP-72); the note below must travel with it
    # the note's text lives in seeds/notes/notes.yml (D-157)
    required_context:
      - id: census_tribal_area

  block_spine:
    category: tabular
    format: parquet
    description: >
      One row per 2020 Census block: its persons, housing units and
      households, and the county, town, House and Senate district (2024) and
      Census tribal area it belongs to. Every overlaps edge is a sum over it.
    resolution_tier: public   # PROPOSED (Sprint 04): Census counts and assignments. For Person 3 to confirm

  block_division_assignment:
    category: tabular
    format: parquet
    description: >
      Each 2020 block's civil division, by the division containing its
      internal point (D-122). How MEGIS divisions join the graph.
    resolution_tier: public   # PROPOSED (Sprint 04). Inherits its polygons' license at the gate (rule 10)

  place_edges:
    category: tabular
    format: parquet
    description: >
      The geography graph's edges (Contract 3): contains, overlaps and
      located_in, each overlap with weight_population and weight_households
      (D-121), its source and vintage.
    resolution_tier: public   # PROPOSED (Sprint 04). For Person 3 to confirm

  governance_unit:
    category: vector
    format: geojson
    description: Town, district, county, state boundaries; carries the minted feature_id.
    resolution_tier: public

  sovereign_boundary:
    category: vector
    format: geojson
    description: >
      A boundary carrying sovereign or self-determined authority, held apart
      from public administrative units (governance_unit) precisely because its
      exposure rules differ. Contexts include Indigenous nations, land trusts,
      and other authority-bearing or contested jurisdictions.
    resolution_tier: custom

  roads:
    category: vector
    format: geojson
    resolution_tier: public   # PROPOSED (Sprint 03, D-118): environmental or analytical, no people's own information. For Person 3 to confirm
    description: >
      Street centerlines as lines (New York's LION, for one): a network of
      where streets run, not road surface. Pavement area is land cover.

  # ----- raster -----

  gi_star_z_scores:
    category: raster
    format: tiff
    resolution_tier: public   # PROPOSED (Sprint 03, D-118): environmental or analytical, no people's own information. For Person 3 to confirm
    description: >
      Getis-Ord Gi* z-scores per raster cell. Positive values indicate local
      clustering of high values (potential hot spot), negative values indicate
      clustering of low values (potential cold spot). Magnitude indicates
      statistical strength.
    typical_units: z-score (standard deviations)
    value_range: [-10, 10]

  ndvi:
    category: raster
    format: tiff
    resolution_tier: public   # PROPOSED (Sprint 03, D-118): environmental or analytical, no people's own information. For Person 3 to confirm
    description: Normalized Difference Vegetation Index.
    typical_units: index
    value_range: [-1, 1]

  land_cover:
    category: raster
    format: tiff
    resolution_tier: public   # PROPOSED (Sprint 03, D-118): environmental or analytical, no people's own information. For Person 3 to confirm
    description: Categorical land cover classification.
    measurement_type: categorical

  nighttime_lights:
    category: raster
    format: tiff
    resolution_tier: public   # PROPOSED (Sprint 03, D-118): environmental or analytical, no people's own information. For Person 3 to confirm
    description: >
      Night-time radiance, such as the VIIRS Day/Night Band annual composite:
      a proxy for built activity and electrification, never a count of people.
    typical_units: nW/cm2/sr

  population_density:
    category: raster
    format: tiff
    resolution_tier: public   # PROPOSED: a modeled aggregate surface, no person's own information. For Person 3 to confirm
    description: >
      People per pixel over a fixed pixel area, as a modeled surface: a source
      such as WorldPop distributes census counts across pixels by covariates,
      so each value is an estimate, never a count of anyone.

  # ----- tabular: spatial summaries -----

  zonal_statistics:
    category: tabular
    format: parquet
    resolution_tier: public   # PROPOSED (Sprint 03, D-118): environmental or analytical, no people's own information. For Person 3 to confirm
    description: Summary statistics aggregated by zone.

  landscape_metrics:
    category: tabular
    format: parquet
    resolution_tier: public   # PROPOSED (Sprint 03, D-118): environmental or analytical, no people's own information. For Person 3 to confirm
    description: Landscape pattern metrics (LSI, SHAPE_MN, PD, AI, etc.).

  land_cover_proportions:
    category: tabular
    format: parquet
    resolution_tier: public   # PROPOSED (Sprint 03, D-118): environmental or analytical, no people's own information. For Person 3 to confirm
    description: Proportional area of each land cover class within zones.

  # ----- tabular: perception primitives (reusable across imagery work) -----

  camera_intrinsics:
    category: tabular
    format: yaml
    description: >
      Pinhole camera matrix and distortion coefficients from checkerboard
      calibration (keys camera_matrix, distortion_coefficients).

  ground_pose:
    category: tabular
    format: yaml
    description: >
      Ground-plane pose (rotation/translation) recovered from a flat board,
      anchoring the image to a metric ground coordinate frame.

  # ----- tabular: learning scaffolding (domain-agnostic) -----

  sample_index:
    category: tabular
    format: parquet
    description: >
      Abstract table of sample records (an id, plus optional label, group,
      coordinates, time) that split_dataset partitions. Domain-agnostic.
      (csv is also accepted at I/O; parquet is canonical.)

  dataset_partition:
    category: tabular
    format: parquet
    description: >
      A sample_index plus a `partition` column (train/test/val). The seed and
      strategy live in the envelope, so the split is reproducible.

  feature_table:
    category: tabular
    format: parquet
    description: >
      Per-sample feature rows (feature columns + optional label + meta such as
      frame/x/y) that train_classifier and apply_classifier consume.

  classifier_model:
    category: tabular
    format: joblib
    description: >
      A trained classifier bundle (estimator, feature_cols, label_col, classes,
      sklearn model). Binary artifact; format is joblib, not a table.

  regressor_model:
    category: tabular
    format: joblib
    description: >
      A trained regressor bundle (estimator, feature_cols, target_col, sklearn
      model). Binary artifact.

  predictions:
    category: tabular
    format: parquet
    description: >
      Per-sample predictions (id + pred + optional confidence). (csv also
      accepted at I/O; parquet is canonical.)

  # ----- tabular: analysis outputs -----

  regression_skill:
    category: tabular
    format: json
    resolution_tier: public   # PROPOSED (Sprint 03, D-118): environmental or analytical, no people's own information. For Person 3 to confirm
    description: Held-out regression skill (R2, RMSE, MAE) on a spatial test split.

  correlation_matrix:
    category: tabular
    format: parquet
    resolution_tier: public   # PROPOSED (Sprint 03, D-118): environmental or analytical, no people's own information. For Person 3 to confirm
    description: Pairwise correlation coefficients between variables.

  regression_results:
    category: tabular
    format: parquet
    resolution_tier: public   # PROPOSED (Sprint 03, D-118): environmental or analytical, no people's own information. For Person 3 to confirm
    description: Regression model outputs with coefficients and diagnostics.

  # ----- image -----

  ground_photograph:
    category: image
    format: png
    description: >
      A ground-level RGB photograph of a space, optionally with a calibration
      board flat on the ground for pose recovery.
  legislature_roster:
    category: tabular
    format: csv
    description: >
      One row per member a legislative chamber's own record names: chamber,
      district as published, name, party, position, seat number, email,
      profile link, residence, source, as_of (the fetch time). No phone
      numbers (D-138). From the maine_legislature provider.

  seats:
    category: tabular
    format: parquet
    description: >
      One row per seat per Legislature, keyed (legislature, chamber,
      seat_kind, seat_ref); Contract 3, section 6. A vacant seat is one the
      record names no holder for.

  place_outline:
    category: vector
    format: geojson
    description: >
      A place's display outline, one feature per (authority, code) at one
      level of the places table, dissolved from the 2024 TIGER/Line faces,
      land only (D-142, D-146). For maps and publication; never an input to
      analysis, and no primitive takes it. Each row carries the context note
      its place carries, so a reservation subdivision drawn among towns keeps
      its note, and may carry a display note declared by the run (D-159).
    resolution_tier: public

  census_tribal_outline:
    category: vector
    format: geojson
    description: >
      A Census tribal area's display outline, dissolved from the 2024 faces
      through 2020 blocks, so the outline of a 2020 place (D-142, D-146).
      The Census's view, never the nation's own (that is sovereign_boundary,
      which leaves only with consent). Never an input to analysis.
    resolution_tier: public   # D-123, D-146: the note's text lives in seeds/notes/notes.yml (D-157)
    required_context:
      - id: census_tribal_area

  located_in_edges:
    category: tabular
    format: parquet
    description: >
      A point layer's located_in edges (Contract 3): each feature, named by
      its layer and feature id, to every place it falls in, weights 1 and 1,
      in place_edges' columns and key. Its own type, never place_edges, since
      loam makes the edges view from exactly one place_edges artifact and a
      second would leave a plot with no edges view at all (D-207). One
      artifact per layer; several are expected.
    # no resolution_tier yet: Person 3 declares it. a point layer's tier is
    # its own, and the edges should carry it, not a default.
