# ═══════════════════════════════════════════════════════════════════════════════
# seeds/schemas/semantic_types.yml
# BASE vocabulary: types reused across every domain.
#
# Domain-specific types live in seeds/schemas/modules/<domain>.yml and are
# merged on top of this file at load time. The loader stamps each type's
# `module` from its source (base here; the filename stem for module files) and
# errors loudly on any cross-file name collision. Names stay flat.
# ═══════════════════════════════════════════════════════════════════════════════

types:

  # ----- vector -----

  study_area:
    category: vector
    format: geojson
    description: Boundary defining the extent of analysis.

  study_boundary:
    category: vector
    format: geojson
    description: >
      Boundary polygon defining the spatial extent of analysis. May be a city
      boundary, neighborhood, watershed, or any user-defined area of interest.

  city_boundary:
    category: vector
    format: geojson
    description: >
      Administrative boundary of a city or municipality. Commonly used as the
      study boundary for city-wide analyses.

  buffer_zones:
    category: vector
    format: geojson
    description: Buffer rings with parent association removed (donut shapes).

  clipped_features:
    category: vector
    format: geojson
    description: Features clipped to a study boundary.

  governance_unit:
    category: vector
    format: geojson
    description: Town, district, county, state boundaries; carries the minted feature_id.
    resolution_tier: public

  sovereign_boundary:
    category: vector
    format: geojson
    description: >
      A boundary carrying sovereign or self-determined authority, held apart
      from public administrative units (governance_unit) precisely because its
      exposure rules differ. Contexts include Indigenous nations, land trusts,
      and other authority-bearing or contested jurisdictions.
    resolution_tier: custom

  # ----- raster -----

  land_surface_temperature:
    category: raster
    format: tiff
    description: LST derived from thermal satellite imagery.
    typical_units: celsius

  gi_star_z_scores:
    category: raster
    format: tiff
    description: >
      Getis-Ord Gi* z-scores per raster cell. Positive values indicate local
      clustering of high values (potential hot spot), negative values indicate
      clustering of low values (potential cold spot). Magnitude indicates
      statistical strength.
    typical_units: z-score (standard deviations)
    value_range: [-10, 10]

  ndvi:
    category: raster
    format: tiff
    description: Normalized Difference Vegetation Index.
    typical_units: index
    value_range: [-1, 1]

  land_cover:
    category: raster
    format: tiff
    description: Categorical land cover classification.
    measurement_type: categorical

  # ----- tabular: spatial summaries -----

  zonal_statistics:
    category: tabular
    format: parquet
    description: Summary statistics aggregated by zone.

  landscape_metrics:
    category: tabular
    format: parquet
    description: Landscape pattern metrics (LSI, SHAPE_MN, PD, AI, etc.).

  land_cover_proportions:
    category: tabular
    format: parquet
    description: Proportional area of each land cover class within zones.

  # ----- tabular: perception primitives (reusable across imagery work) -----

  camera_intrinsics:
    category: tabular
    format: yaml
    description: >
      Pinhole camera matrix and distortion coefficients from checkerboard
      calibration (keys camera_matrix, distortion_coefficients).

  ground_pose:
    category: tabular
    format: yaml
    description: >
      Ground-plane pose (rotation/translation) recovered from a flat board,
      anchoring the image to a metric ground coordinate frame.

  # ----- tabular: learning scaffolding (domain-agnostic) -----

  sample_index:
    category: tabular
    format: parquet
    description: >
      Abstract table of sample records (an id, plus optional label, group,
      coordinates, time) that split_dataset partitions. Domain-agnostic.
      (csv is also accepted at I/O; parquet is canonical.)

  dataset_partition:
    category: tabular
    format: parquet
    description: >
      A sample_index plus a `partition` column (train/test/val). The seed and
      strategy live in the envelope, so the split is reproducible.

  feature_table:
    category: tabular
    format: parquet
    description: >
      Per-sample feature rows (feature columns + optional label + meta such as
      frame/x/y) that train_classifier and apply_classifier consume.

  classifier_model:
    category: tabular
    format: joblib
    description: >
      A trained classifier bundle (estimator, feature_cols, label_col, classes,
      sklearn model). Binary artifact; format is joblib, not a table.

  regressor_model:
    category: tabular
    format: joblib
    description: >
      A trained regressor bundle (estimator, feature_cols, target_col, sklearn
      model). Binary artifact.

  predictions:
    category: tabular
    format: parquet
    description: >
      Per-sample predictions (id + pred + optional confidence). (csv also
      accepted at I/O; parquet is canonical.)

  # ----- tabular: analysis outputs -----

  regression_skill:
    category: tabular
    format: json
    description: Held-out regression skill (R2, RMSE, MAE) on a spatial test split.

  correlation_matrix:
    category: tabular
    format: parquet
    description: Pairwise correlation coefficients between variables.

  regression_results:
    category: tabular
    format: parquet
    description: Regression model outputs with coefficients and diagnostics.

  # ----- image -----

  ground_photograph:
    category: image
    format: png
    description: >
      A ground-level RGB photograph of a space, optionally with a calibration
      board flat on the ground for pose recovery.