# ═══════════════════════════════════════════════════════════════════════════════
# seeds/schemas/domains/information.yml
# Domain vocabulary: information-ecosystem mapping (the Maine project).
# Merged on top of the base file. Loader stamps domain = "information".
#
# Every type here previously had an empty `format:` (which crashed the loader,
# since format is required). Formats are assigned by category. The
# resolution_tier values are advisory metadata until an exposure gate exists
# to enforce them.
#
# Indicators are NOT types. A semantic type names a kind of artifact; what an
# indicator measures, in what unit, which direction is better, and how it
# composes across units are declared once per indicator in seeds/indicators/.
# Two types carry every indicator: indicator_source (the raw published values
# a derivation reads) and indicator_values (the derived measurements).
#
# ═══════════════════════════════════════════════════════════════════════════════

types:

  # ----- vector: information nodes -----

  formal_outlet:
    category: vector
    format: geojson
    description: Print, broadcast, digital, radio outlets.
    resolution_tier: public

  # ----- tabular: outlet records (Sprint 06, step 8) -----

  outlet_listing:
    category: tabular
    format: csv
    description: >
      One source's list of outlets, exactly as published or exported: a
      commercial database's export, a journalist's own list, a funder's
      file. Read only as seeds/crosswalks/outlets/outlet_sources.yml
      declares (D-201). Input to a claim about outlets, never the claim.
    resolution_tier: excluded   # holds commercial and personal data under unrecorded terms (SRC-4); it never leaves as it is

  outlet_stack:
    category: tabular
    format: csv
    description: >
      Every listing's outlet records stacked side by side, one row per
      source record, keyed by (source, source_line), each field carrying
      the meaning its source gives it (D-203). Nothing is merged.
    # no resolution_tier yet: Person 3 declares it. until then it fails
    # closed, which is right while it carries listings' fields.

  outlet_groups:
    category: tabular
    format: csv
    description: >
      The outlet stack with each record's group: records sharing an exact
      url or name key, never one source twice (D-202). A group is a set of
      records that share a key, not a judgment that they are one outlet.
    # no resolution_tier yet: Person 3 declares it, as outlet_stack.

  outlet_disagreements:
    category: tabular
    format: csv
    description: >
      Where a group's sources hold different values for one field, one row
      per group, field and source, like compared only with like (D-203).
      What the profile's "where sources disagree" reads.
    # no resolution_tier yet: Person 3 declares it, as outlet_stack.

  owner_crosswalk:
    category: tabular
    format: csv
    description: >
      Raw owner strings mapped to canonical owner entities, one row per raw
      string, with a confidence flag and a note (raw, owner_entity,
      confidence, note). Every merge of two owners is a row a person can read.
    # no resolution_tier yet: Person 3 declares it (Sprint 03). until then it
    # fails closed, which is right for a working file.

  institutional_node:
    category: vector
    format: geojson
    description: Libraries, town halls, schools, government websites.
    resolution_tier: public

  relational_hub:
    category: vector
    format: geojson
    description: Forums, groups, listservs, mutual-aid networks.
    resolution_tier: aggregate-only   # was aggregate-optionally; never shown as named individuals

  # ----- raster -----

  access_infrastructure:
    category: raster
    format: tiff
    description: >
      Broadband, cell and cable AVAILABILITY as a coverage surface: whether
      infrastructure reaches a place, not whether anyone there subscribes.
      Household subscription (ACS B28002) is adoption, a different claim, and
      lives in indicator_values via the indicator registry. Provider-reported
      sources such as the FCC National Broadband Map overstate availability.
    resolution_tier: public

  # ----- tabular: indicators -----

  indicator_source:
    category: tabular
    format: parquet
    description: >
      Raw published values that an indicator derivation reads, one row per
      unit: ACS estimate and margin-of-error columns, or a published table
      such as County Health Rankings. Input to a claim, not yet a claim.
      (csv is also accepted at I/O, as acquisition caches are csv by
      declaration; parquet is canonical.)
    resolution_tier: public

  indicator_values:
    category: tabular
    format: parquet
    description: >
      Derived indicator measurements, one row per unit and indicator: the
      estimate, its margin of error where the source publishes one, and the
      registry entry that produced it. Measurements from different
      authorities about the same unit and indicator are held side by side,
      never averaged.
    resolution_tier: public

  indicator_standings:
    category: tabular
    format: parquet
    description: >
      Where each unit stands among a declared reference population, one row
      per unit and indicator: a direction-adjusted z-score and a percentile.
      Relative by construction. A standing says how a unit compares and never
      whether its value is sufficient: if every county had poor broadband,
      the top one would still stand at 100. A standard is a different claim,
      assessed against an absolute threshold, not against other places.
    resolution_tier: public

  indicator_index:
    category: tabular
    format: parquet
    description: >
      A weighted composite of declared components per unit: a pillar's mean
      of indicator z-scores, or an overall mean of pillar percentiles, with
      its percentile. Relative, like a standing, and it records which
      weighting produced it and whether that weighting is the publisher's.
    resolution_tier: public

  unit_locations:
    category: tabular
    format: parquet
    description: >
      One point per unit, GEOID with latitude and longitude, for questions of
      distance between units such as the geographic stage of imputation. A
      representative point, not a boundary: it says where a unit is, never
      what it contains. Parquet, so a GEOID stays a string: CSV read by R
      turns 01001 into 1001.
    resolution_tier: public

  # ----- tabular -----

  flow_edges:
    category: tabular
    format: parquet
    description: Pathways between node types.
    resolution_tier: excluded   # safe default until node/edge modeling + exposure gate exist; then aggregate-only. Flow data does not exist yet (Tier 3).

  community_context:
    category: tabular
    format: parquet
    description: Demographics, rurality, language, civic participation.
    resolution_tier: custom   # potentially public; unit-level public-source aggregate. Field-level sensitivity deferred to per-field tiers. FLAG for review. Overlaps indicator_values; candidate to retire the same way.

  information_sufficiency:
    category: tabular
    format: parquet
    description: Whether a unit's information lifecycle meets its needs.
    resolution_tier: public

  financial_resilience:
    category: tabular
    format: parquet
    description: Derived score of financial and staffing stability per unit.
    resolution_tier: public   # supersedes the earlier "resilience_score" name; keep registry and curiosities in sync

  ownership_concentration:
    category: tabular
    format: parquet
    description: Derived score of ownership consolidation per unit.
    resolution_tier: public   # output type of concentration_index (already wired)

  # ----- carriers (Sprint 06, step 3) -----

  library_survey_release:
    category: tabular
    format: zip
    description: >
      An IMLS Public Libraries Survey release as published: a zip of CSV
      files, one for library systems (visits, legal service area population)
      and one for outlets (central libraries, branches, bookmobiles, with
      coordinates). Read only by declared member and encoding.
    resolution_tier: public   # public-use files, no license required

