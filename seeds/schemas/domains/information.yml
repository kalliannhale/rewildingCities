# ═══════════════════════════════════════════════════════════════════════════════
# seeds/schemas/domains/information.yml
# Domain vocabulary: information-ecosystem mapping (the Maine project).
# Merged on top of the base file. Loader stamps domain = "information".
#
# Every type here previously had an empty `format:` (which crashed the loader,
# since format is required). Formats are assigned by category. The
# resolution_tier values are advisory metadata until an exposure gate exists
# to enforce them.
#
# Indicators are NOT types. A semantic type names a kind of artifact; what an
# indicator measures, in what unit, which direction is better, and how it
# composes across units are declared once per indicator in seeds/indicators/.
# Two types carry every indicator: indicator_source (the raw published values
# a derivation reads) and indicator_values (the derived measurements).
#
# ═══════════════════════════════════════════════════════════════════════════════

types:

  # ----- vector: information nodes -----

  formal_outlet:
    category: vector
    format: geojson
    description: Print, broadcast, digital, radio outlets.
    resolution_tier: public

  institutional_node:
    category: vector
    format: geojson
    description: Libraries, town halls, schools, government websites.
    resolution_tier: public

  relational_hub:
    category: vector
    format: geojson
    description: Forums, groups, listservs, mutual-aid networks.
    resolution_tier: aggregate-only   # was aggregate-optionally; never shown as named individuals

  # ----- raster -----

  access_infrastructure:
    category: raster
    format: tiff
    description: >
      Broadband, cell and cable AVAILABILITY as a coverage surface: whether
      infrastructure reaches a place, not whether anyone there subscribes.
      Household subscription (ACS B28002) is adoption, a different claim, and
      lives in indicator_values via the indicator registry. Provider-reported
      sources such as the FCC National Broadband Map overstate availability.
    resolution_tier: public

  # ----- tabular: indicators -----

  indicator_source:
    category: tabular
    format: parquet
    description: >
      Raw published values that an indicator derivation reads, one row per
      unit: ACS estimate and margin-of-error columns, or a published table
      such as County Health Rankings. Input to a claim, not yet a claim.
      (csv is also accepted at I/O, as acquisition caches are csv by
      declaration; parquet is canonical.)
    resolution_tier: public

  indicator_values:
    category: tabular
    format: parquet
    description: >
      Derived indicator measurements, one row per unit and indicator: the
      estimate, its margin of error where the source publishes one, and the
      registry entry that produced it. Measurements from different
      authorities about the same unit and indicator are held side by side,
      never averaged.
    resolution_tier: public

  # ----- tabular -----

  flow_edges:
    category: tabular
    format: parquet
    description: Pathways between node types.
    resolution_tier: excluded   # safe default until node/edge modeling + exposure gate exist; then aggregate-only. Flow data does not exist yet (Tier 3).

  community_context:
    category: tabular
    format: parquet
    description: Demographics, rurality, language, civic participation.
    resolution_tier: custom   # potentially public; unit-level public-source aggregate. Field-level sensitivity deferred to per-field tiers. FLAG for review. Overlaps indicator_values; candidate to retire the same way.

  information_sufficiency:
    category: tabular
    format: parquet
    description: Whether a unit's information lifecycle meets its needs.
    resolution_tier: public

  financial_resilience:
    category: tabular
    format: parquet
    description: Derived score of financial and staffing stability per unit.
    resolution_tier: public   # supersedes the earlier "resilience_score" name; keep registry and curiosities in sync

  ownership_concentration:
    category: tabular
    format: parquet
    description: Derived score of ownership consolidation per unit.
    resolution_tier: public   # output type of concentration_index (already wired)