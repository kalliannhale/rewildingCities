# ═══════════════════════════════════════════════════════════════════════════════
# seeds/schemas/domains/information.yml
# Domain vocabulary: information-ecosystem mapping (the Maine project).
# Merged on top of the base file. Loader stamps domain = "information".
#
# Every type here previously had an empty `format:` (which crashed the loader,
# since format is required). Formats are assigned by category. The gate
# (canopy/expose/gate.py, Contract 1) enforces each resolution_tier; a type
# that declares `aggregates: true` may carry an aggregate-only ancestor out
# as counts (rule 5).
#
# Indicators are NOT types. A semantic type names a kind of artifact; what an
# indicator measures, in what unit, which direction is better, and how it
# composes across units are declared once per indicator in seeds/indicators/.
# Two types carry every indicator: indicator_source (the raw published values
# a derivation reads) and indicator_values (the derived measurements).
#
# ═══════════════════════════════════════════════════════════════════════════════

types:

  # ----- vector: information nodes -----

  formal_outlet:
    category: vector
    format: geojson
    description: Print, broadcast, digital, radio outlets.
    resolution_tier: public

  # ----- tabular: outlet records (Sprint 06, step 8) -----

  outlet_listing:
    category: tabular
    format: csv
    description: >
      One source's list of outlets, exactly as published or exported: a
      commercial database's export, a journalist's own list, a funder's
      file. Read only as seeds/crosswalks/outlets/outlet_sources.yml
      declares (D-201). Input to a claim about outlets, never the claim.
    resolution_tier: aggregate-only   # Kalli, session 16 (D-295): leaves only as counts over a place; its license term says why (D-299, D-300)
  commercial_outlet_listing:
    category: tabular
    format: csv
    description: >
      A commercial media database's export of outlet records (Cision's),
      read as seeds/crosswalks/outlets/outlet_sources.yml declares. Its own
      type so that no reading of a list's terms can reach it: a plot that
      stacks one again is stopped at the door by its type (D-294).
    resolution_tier: excluded   # Kalli, session 16 (D-294): a commercial database's terms do not permit redistribution of what it holds

  outlet_stack:
    category: tabular
    format: csv
    description: >
      Every listing's outlet records stacked side by side, one row per
      source record, keyed by (source, source_line), each field carrying
      the meaning its source gives it (D-203). Nothing is merged.
    resolution_tier: aggregate-only   # Kalli, session 16 (D-297): it carries listings' fields, so only counts leave

  outlet_groups:
    category: tabular
    format: csv
    description: >
      The outlet stack with each record's group: records sharing an exact
      url or name key, never one source twice (D-202). A group is a set of
      records that share a key, not a judgment that they are one outlet.
    resolution_tier: aggregate-only   # Kalli, session 16 (D-297), as outlet_stack

  news_outlet:
    category: tabular
    format: csv
    description: >
      One local news outlet per row, written once from a group of listing
      records, with an id made from its members (D-243), placed by the code
      of the town its listings give, never by a point (D-241, D-242): the
      town, how it was placed (named_town, office_town, reviewed), the words
      that placed it, its operating status and every record behind it.
      Counted through located_in edges at town, county and state only
      (D-246).
    resolution_tier: aggregate-only   # Kalli, session 16 (D-297): counts now; named outlets after OUTCONF-1, by a change of tier here

  outlet_disagreements:
    category: tabular
    format: csv
    description: >
      Where a group's sources hold different values for one field, one row
      per group, field and source, like compared only with like (D-203).
      What the profile's "where sources disagree" reads.
    # no resolution_tier yet: Person 3 declares it, as outlet_stack.

  owner_crosswalk:
    category: tabular
    format: csv
    description: >
      Raw owner strings mapped to canonical owner entities, one row per raw
      string, with a confidence flag and a note (raw, owner_entity,
      confidence, note). Every merge of two owners is a row a person can read.
    # no resolution_tier yet: Person 3 declares it (Sprint 03). until then it
    # fails closed, which is right for a working file.

  library_outlet:
    category: vector
    format: geojson
    description: >
      One placed public library outlet as a point: a central library or a
      branch from an IMLS Public Libraries Survey outlet file, keyed
      FSCSKEY-FSCS_SEQ. Outlet is IMLS's word for a library building, never
      a news outlet (formal_outlet). Which outlets are placed, and why, is
      the library_carriers method's to say (D-212). Each carrier kind is its
      own type (D-218); this one retires institutional_node, with no alias
      (D-219).
    resolution_tier: public   # IMLS public-use files, as library_survey_release

  public_school:
    category: vector
    format: geojson
    description: >
      One placed public school as a point, from an NCES EDGE public school
      geocode release, keyed by NCESSCH. Which schools are placed, and why,
      is the school_carriers method's to say (D-212). Each carrier kind is
      its own type (D-218); private schools would be another.
    resolution_tier: public   # Kalli, session 15 (D-283): a U.S. government work, NCES EDGE public-use points

  health_center_site:
    category: vector
    format: geojson
    description: >
      One placed health center site as a point, from a copy of HRSA's Health
      Center Service Delivery and Look-Alike Sites file, keyed by its BPHC
      Assigned Number. Which sites are placed, and why, is the
      health_center_carriers method's to say (D-212). Each carrier kind is
      its own type (D-218).
    resolution_tier: public   # Kalli, session 15 (D-283): a U.S. government work, HRSA's public sites file

  municipal_clerk_office:
    category: vector
    format: geojson
    description: >
      One placed municipal clerk's office as a point: the address point a
      state's 911 file holds at the street address a state's clerk list
      gives, keyed by that point's own site id. One point per distinct
      office; the municipalities whose rows name it ride on the point, and
      whom it serves stays SERVES-1's. Which offices are placed, and why, is
      the clerk_office_carriers method's to say (D-212). Each carrier kind
      is its own type (D-218).
    resolution_tier: public   # Kalli, session 16 (D-297): a public office at a point the state publishes

  relational_hub:
    category: vector
    format: geojson
    description: Forums, groups, listservs, mutual-aid networks.
    resolution_tier: aggregate-only   # was aggregate-optionally; never shown as named individuals

  # ----- raster -----

  access_infrastructure:
    category: raster
    format: tiff
    description: >
      Broadband, cell and cable AVAILABILITY as a coverage surface: whether
      infrastructure reaches a place, not whether anyone there subscribes.
      Household subscription (ACS B28002) is adoption, a different claim, and
      lives in indicator_values via the indicator registry. Provider-reported
      sources such as the FCC National Broadband Map overstate availability.
    resolution_tier: public

  # ----- tabular: indicators -----

  indicator_source:
    category: tabular
    format: parquet
    description: >
      Raw published values that an indicator derivation reads, one row per
      unit: ACS estimate and margin-of-error columns, or a published table
      such as County Health Rankings. Input to a claim, not yet a claim.
      (csv is also accepted at I/O, as acquisition caches are csv by
      declaration; parquet is canonical.)
    resolution_tier: public

  indicator_values:
    category: tabular
    format: parquet
    description: >
      Derived indicator measurements, one row per unit and indicator: the
      estimate, its margin of error where the source publishes one, and the
      registry entry that produced it. Measurements from different
      authorities about the same unit and indicator are held side by side,
      never averaged.
    resolution_tier: public
    aggregates: true   # Kalli, session 16 (D-296): one value per unit, never a named member, so an aggregate-only ancestor may leave through it (rule 5)

  indicator_standings:
    category: tabular
    format: parquet
    description: >
      Where each unit stands among a declared reference population, one row
      per unit and indicator: a direction-adjusted z-score and a percentile.
      Relative by construction. A standing says how a unit compares and never
      whether its value is sufficient: if every county had poor broadband,
      the top one would still stand at 100. A standard is a different claim,
      assessed against an absolute threshold, not against other places.
    resolution_tier: public

  indicator_index:
    category: tabular
    format: parquet
    description: >
      A weighted composite of declared components per unit: a pillar's mean
      of indicator z-scores, or an overall mean of pillar percentiles, with
      its percentile. Relative, like a standing, and it records which
      weighting produced it and whether that weighting is the publisher's.
    resolution_tier: public

  unit_locations:
    category: tabular
    format: parquet
    description: >
      One point per unit, GEOID with latitude and longitude, for questions of
      distance between units such as the geographic stage of imputation. A
      representative point, not a boundary: it says where a unit is, never
      what it contains. Parquet, so a GEOID stays a string: CSV read by R
      turns 01001 into 1001.
    resolution_tier: public

  # ----- tabular -----

  flow_edges:
    category: tabular
    format: parquet
    description: Pathways between node types.
    resolution_tier: excluded   # safe default until node/edge modeling + exposure gate exist; then aggregate-only. Flow data does not exist yet (Tier 3).

  community_context:
    category: tabular
    format: parquet
    description: Demographics, rurality, language, civic participation.
    resolution_tier: custom   # potentially public; unit-level public-source aggregate. Field-level sensitivity deferred to per-field tiers. FLAG for review. Overlaps indicator_values; candidate to retire the same way.

  information_sufficiency:
    category: tabular
    format: parquet
    description: Whether a unit's information lifecycle meets its needs.
    resolution_tier: public

  financial_resilience:
    category: tabular
    format: parquet
    description: Derived score of financial and staffing stability per unit.
    resolution_tier: public   # supersedes the earlier "resilience_score" name; keep registry and curiosities in sync

  ownership_concentration:
    category: tabular
    format: parquet
    description: Derived score of ownership consolidation per unit.
    resolution_tier: public   # output type of concentration_index (already wired)

  # ----- carriers (Sprint 06, step 3) -----

  library_survey_release:
    category: tabular
    format: zip
    description: >
      An IMLS Public Libraries Survey release as published: a zip of CSV
      files, one for library systems (visits, legal service area population)
      and one for outlets (central libraries, branches, bookmobiles, with
      coordinates). Read only by declared member and encoding.
    resolution_tier: public   # public-use files, no license required

  school_geocode_release:
    category: tabular
    format: zip
    description: >
      An NCES EDGE public school geocode release as published: a zip holding
      one table four ways (shapefile, Excel, a headerless pipe-separated text
      table, SAS), one row per CCD public school with NCESSCH, reported
      address, operating state and coordinates. Read only by declared member
      and encoding.
    resolution_tier: public   # Kalli, session 15 (D-283): a U.S. government work, as public_school

  health_center_sites_snapshot:
    category: tabular
    format: csv
    description: >
      A copy of HRSA's Health Center Service Delivery and Look-Alike Sites
      file as downloaded: one row per site with its BPHC Assigned Number,
      site and location types, setting, status and HRSA's geocode. A daily
      snapshot, not a release, so a copy is declared by its day and its
      sha256. Read only by declared columns and encoding.
    resolution_tier: public   # Kalli, session 15 (D-283): a U.S. government work, as health_center_site

  municipal_clerk_list:
    category: tabular
    format: csv
    description: >
      A copy of a state's list of municipal clerks as published: one row per
      municipality with its clerk's street address and a code for the
      municipality. An export, not a release, so a copy is declared by its
      day and its sha256. Read only by declared columns and encoding; the
      clerks' names and phones are never read (D-236).
    resolution_tier: public   # Kalli, session 16 (D-297): a state's directory of every clerk, under factual_directory (D-299)

  address_point_release:
    category: tabular
    format: zip
    description: >
      A state's 911 address points as published, in the archive it arrives
      in: one point per addressable site with its house number, street
      parts, ZIP, use and how it was placed. Declared by its information
      cutoff and its sha256; read only by declared layer, CRS and fields.
      It holds home addresses: only points a method matches ever leave it.
    resolution_tier: public   # Kalli, session 16 (D-297, D-298): the state publishes it through the GeoLibrary. the release itself is never a publish target; only its matched points leave

  section203_public_use_file:
    category: tabular
    format: zip
    description: >
      The Census's Section 203 public use files as released: one zip of CSVs
      and their documentation, every jurisdiction by language minority group
      with the flags that decided coverage. A release, declared by its sha256;
      read only by declared member, encoding and columns.
    resolution_tier: public   # Kalli, session 15 (D-283): a U.S. government work, the Census Bureau's public use file

  section203_records:
    category: tabular
    format: csv
    description: >
      One state's Section 203 records, read as published: the state, each
      town under our town code, and the American Indian areas overlapping its
      towns under Census's own area code, by language minority group, with
      Census's flags copied (D-263, D-264). Published determinations, never
      recomputed.
    resolution_tier: public   # Kalli, session 15 (D-283): a U.S. government work; its tribal rows attach to no place (D-264)

  piaac_skills_map_workbook:
    category: tabular
    format: xlsx
    description: >
      The U.S. PIAAC Skills Map's downloadable workbook: model-based state
      and county estimates of adult literacy and numeracy with credible
      intervals and quality flags. Declared by its download day and sha256.
    resolution_tier: public   # Kalli, session 15 (D-283): a U.S. government work, NCES's published workbook

  literacy_estimates:
    category: tabular
    format: csv
    description: >
      Adult literacy at or below PIAAC Level 1 for one state and its
      counties: the share, its 95 percent credible bounds, the workbook's
      flags and left_out, the population times the share and its bounds
      (D-265). Model-based; never combined with its own predictors.
    resolution_tier: public   # Kalli, session 15 (D-283): a U.S. government work, read from NCES's Skills Map
