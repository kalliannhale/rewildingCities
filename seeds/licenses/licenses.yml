# ═══════════════════════════════════════════════════════════════════════════════
# seeds/licenses/licenses.yml
# The controlled list of license terms the gate reads (Contract 1, rule 10;
# D-116). A dataset declares one in its manifest entry as `license: <term>`,
# with any free text in `license_note`. A term not on this list fails closed,
# as an undeclared tier does.
#
# `permits` is the sharing levels a term allows redistribution at: private
# (the owner only), organization, public. A term is a claim about someone
# else's permission, so each says where the claim comes from and whether it
# has been checked. An unverified term permits nothing beyond private.
#
# `requires_tier`, when a term declares it, ties the term to one form of
# leaving: rule 10 refuses a dataset under the term unless the dataset's own
# semantic type declares that tier. A reading that holds only for counts says
# so here, and no plot can lay it on a type that leaves as named members
# (D-299).
# ═══════════════════════════════════════════════════════════════════════════════

terms:
  us_government_work:
    name: Work of the United States government
    permits: [private, organization, public]
    attribution: recommended
    verified: true
    basis: >
      17 U.S.C. § 105: copyright protection is not available for works of the
      United States government. Census ACS estimates, TIGER/Line boundaries and
      the Census Gazetteer are such works. Attribution is good practice, not a
      condition.

  cc_by_4_0:
    name: Creative Commons Attribution 4.0
    permits: [private, organization, public]
    attribution: required
    verified: true
    basis: >
      Redistribution in any medium is permitted with attribution, a link to
      the license, and an indication of changes.

  nyc_open_data_terms:
    name: NYC Open Data Terms of Use
    permits: [private]
    attribution: unknown
    verified: false
    basis: >
      Named in NYC's manifest as free text. What these terms permit has not
      been read and recorded here, so this term permits nothing beyond
      private until it is.

  maine_geolibrary_public:
    name: Data made available through the Maine Library of Geographic Information
    permits: [private, organization, public]
    attribution: required
    verified: true
    basis: >
      5 M.R.S.A. section 2005: the GeoLibrary board and data custodians may not
      fix copyright or licensing restrictions on information made available
      through the Maine Library of Geographic Information; fees may cover
      electronic copies only. Section 2004: neither the board nor anyone
      submitting data for public use is liable for any use of it. The
      GeoLibrary's layer metadata asks that the source be credited when data
      is transferred or printed, so attribution is a condition here. Section
      1995 (licensing agreements for GIS data) sits in the subchapter on the
      Office of GIS and reads as governing its services to state agencies;
      that reading is Kalli's (session 15, D-290), and the GeoLibrary Board
      (GeolibraryBoard.OIT@maine.gov) is the authority to ask. Read
      2026-11-16 at legislature.maine.gov; the boundary layers' own item
      metadata is not yet read (LIC-2).

  terms_unknown:
    name: Terms unknown
    permits: [private]
    attribution: unknown
    verified: true
    basis: >
      No published terms were found, or nobody has looked yet. Nothing leaves
      beyond its owner until someone does. CII's published file is here while
      its terms are asked about (CII-19).

  factual_directory:
    name: A directory of facts, every member listed
    permits: [private, organization, public]
    attribution: recommended
    verified: true
    basis: >
      Facts carry no copyright, and a compilation of them is protected only
      in an original selection or arrangement of them (Feist Publications v.
      Rural Telephone Service, 499 U.S. 340, 1991). A list of every member of
      a class, in an obvious order, holds no original selection: the Maine
      Secretary of State's list of every municipal clerk, alphabetical by
      town, is such a list, and its page states no terms (read 2026-11-14).
      That reading is Kalli's (session 16, D-299), not a lawyer's; the names
      and phones in the list are never read (D-236), so only offices' places
      and the municipalities they answer for can leave.

  factual_compilation_counts:
    name: A selected list of facts, counted only
    permits: [private, organization, public]
    requires_tier: aggregate-only
    attribution: recommended
    verified: true
    basis: >
      A list whose makers chose its members (which outlets count as Maine
      news) may hold copyright in that selection (Feist, 499 U.S. 340). A
      count of members per place reproduces facts and none of the
      selection, so counts may leave and named members may not. Kalli's
      reading (session 16, D-299), not a lawyer's, for Jo Easton's list and
      Local News Catalyst's; requires_tier holds it to counts. Named
      outlets wait for each maker's word, asked in the project's wrap-up.

  project_own_work:
    name: Made by this project
    permits: [private, organization, public]
    attribution: required
    verified: true
    basis: >
      Compiled by the Maine news ecosystem project itself (the Maine Media
      Ecosystem file, Kalli, session 16, D-300); credited to the project
      wherever it is shown. To confirm with Dr. Mittal in the wrap-up.
