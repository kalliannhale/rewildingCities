# seeds/crosswalks/outlets/outlet_sources.yml
#
# how each outlet source is read, declared rather than guessed (P-9).
# every field a source carries is named here with the column it comes from;
# a column not named is never read. a source's header row is found by its
# declared column names, so a caveat line above the headers cannot shift it.
#
# what P-9 found, so nobody has to rediscover it:
#   ~ language of publication: no source carries it usably. Cision's
#     Outlet Language reads English on every row and omits Amjambo Africa,
#     which publishes in seven languages. it is kept raw, never defaulted
#     for any other source.
#   ~ publishing frequency: three sources, three shapes. Cision declares it;
#     the Maine Media Ecosystem file holds it in Print for print media only
#     (Print holds a station's format for radio); Jo Easton's Format is free
#     text mixing medium and cycle, kept raw and never parsed.
#   ~ paywall status: no source carries it.
#   ~ the aggregated-signals file is a survey about which data exists, not an
#     outlet list, and carries respondent files; it is not read here.
#
#   ~ where an outlet is means three different things across the sources,
#     so the stack keeps three kinds of place field and never compares one
#     kind with another:
#       office_*   a postal address (Cision). it is the publisher's office:
#                  Cision puts the Advertiser Democrat, a Norway paper, in
#                  South Portland
#       named_*    the town a source names for the outlet, without saying
#                  office or coverage (Local News Catalyst, the ecosystem file)
#       served_raw the communities a source says the outlet serves, as free
#                  text (Jo Easton)
#   ~ Cision's Outlet County reads Cook, a county in Illinois, for outlets
#     that are plainly in Maine. it is kept raw and flagged, never trusted.
#
# frequency maps a raw value to a cycle only by exact match after trimming.
# a value in no list stays unmapped and says so. a county not in `counties`
# is flagged in location_note, with or without a trailing " County". ~
#
# read by prepare_news_outlets (D-243, D-245), not by the stack:
#   ~ source_order: whose record names an outlet. an outlet's id is made
#     from its first member in this order, never from row order, so a fresh
#     copy of one listing renumbers no other outlet. the sources that name
#     a town come first
#   ~ operating_vocabulary: what a source's operating status means. only
#     Cision's 353-row file carries one, a hand-added Still Operates?
#     column whose author and day are not recorded (SRC-4), so it is weak
#     evidence, and every outlet it marks ceased is listed by name. compared
#     after lowercasing and collapsing spaces. a value opening with
#     last_post_prefix is quiet, not closed: it is counted and keeps its
#     words. a value in no list stays counted and says so
#   ~ operating_elsewhere: a status a source writes outside its operating
#     column (D-251). the ecosystem file writes CLOSED in its Medium; read
#     it there, by exact words after lowercasing, as the class it names
#   ~ source_kinds: what being on a listing says about an outlet (D-247).
#     a local_news_list is a person's choice of local news outlets, so an
#     outlet on one is local news by that list's say. a media_database
#     holds every outlet with an address, so an outlet only a database
#     holds is judged by its type. Easton's Format and the other lists'
#     medium words are kept as written and never parsed
#   ~ media_database_types: every type a media database writes, mapped by
#     exact match after trimming to a class with two axes, its medium and
#     its audience: Cision's "Magazine, trade/industry" is both. a type in
#     no list refuses the run, so a fresh export with a new type stops
#     rather than guesses. 0 is a placeholder, declared unknown, never a
#     class (D-247). a class names the database_alone options it counts
#     under; a program names none, since it airs on a station (D-248)
#   ~ statewide_names: a town field holding one of these names an outlet
#     for the whole state, placed in the state alone (D-249)

counties: [Androscoggin, Aroostook, Cumberland, Franklin, Hancock, Kennebec,
           Knox, Lincoln, Oxford, Penobscot, Piscataquis, Sagadahoc, Somerset,
           Waldo, Washington, York]

source_order: [local_news_catalyst, maine_media_ecosystem, cision, cision_raw, easton]

operating_vocabulary:
  operating: ["yes"]
  ceased: ["Ceased Operations"]
  last_post_prefix: "Last post"

operating_elsewhere:
  maine_media_ecosystem:
    medium_raw: {ceased: ["CLOSED"]}

source_kinds:
  local_news_catalyst: local_news_list
  maine_media_ecosystem: local_news_list
  easton: local_news_list
  cision: media_database
  cision_raw: media_database

statewide_names: ["Statewide"]

media_database_types:
  read_for: [cision, cision_raw]
  classes:
    newspaper:             {medium: newspaper, audience: general, counted_under: [newspapers, print_and_web]}
    newsletter:            {medium: newsletter, audience: unstated, counted_under: [print_and_web]}
    online_consumer:       {medium: online, audience: consumer, counted_under: [print_and_web]}
    online_trade:          {medium: online, audience: trade}
    magazine_consumer:     {medium: magazine, audience: consumer}
    magazine_trade:        {medium: magazine, audience: trade}
    magazine_academic:     {medium: magazine, audience: academic}
    blog_consumer:         {medium: blog, audience: consumer}
    blog_trade:            {medium: blog, audience: trade}
    blog_podcast_consumer: {medium: "blog and podcast", audience: consumer}
    podcast:               {medium: podcast, audience: unstated}
    radio_station:         {medium: radio, audience: general}
    television_station:    {medium: television, audience: general}
    radio_program:         {medium: radio, audience: general, program: true}
    television_program:    {medium: television, audience: general, program: true}
    supplement:            {medium: supplement, audience: international}
    social_network:        {medium: social network, audience: general}
    not_media:             {medium: none, audience: none}
    unknown:               {unknown: true}
  # Cision's Outlet Type as written, from both Maine pulls (read in session 11)
  values:
    "Newspaper": newspaper
    "Newsletter": newsletter
    "Online, consumer": online_consumer
    "Online, trade/industry": online_trade
    "Magazine, consumer": magazine_consumer
    "Magazine, trade/industry": magazine_trade
    "Magazine, technical/scientific/academic": magazine_academic
    "Blog, consumer": blog_consumer
    "Blog, trade/industry": blog_trade
    "Blog, Podcast, consumer": blog_podcast_consumer
    "Podcast": podcast
    "Radio station": radio_station
    "Television station": television_station
    "Radio program": radio_program
    "Television program": television_program
    "Supplement (International)": supplement
    "Social Networking Site": social_network
    "Maine.gov": not_media
    "Industry research organization": not_media
    "0": unknown

frequency_vocabulary:
  daily: ["Daily", "Daily (Mon-Fri)", "5 Days", "6 Days"]
  several_weekly: ["Multiple times/week", "2x/week"]
  weekly: ["Weekly", "Sunday", "Saturday", "Weekend"]
  twice_monthly: ["2x/month", "2X per month"]
  monthly: ["Monthly"]
  every_other_month: ["Every other month"]
  quarterly: ["Quarterly"]
  twice_yearly: ["2x/year"]
  annually: ["Annually"]
  irregular: ["Irregular/Other"]
  not_applicable: ["Not applicable"]
  # left out on purpose: "2 Monthly" (twice a month or every two months?),
  # "No" (no print edition), "0". each stays unmapped, with its value said.

sources:
  cision:
    file: "garden/reference/Maine Media Outlets_Cision(Sheet 1).csv"
    published_by: Cision
    license: terms_unknown
    notes: >
      353 rows with a hand-added Still Operates? column, which is not a
      Cision field: someone judged closures and last posts. who and when is
      not yet recorded.
    columns:
      name: "Outlet Name"
      url: "Outlet Website"
      office_town: "Outlet City"
      office_county: "Outlet County"
      medium_raw: "Outlet Type"
      frequency_raw: "Outlet Frequency"
      operating_raw: "Still Operates?"
      language_raw: "Outlet Language"
      address_raw: "Outlet Address Line 1"
      zip_raw: "Outlet Zip Code"

  cision_raw:
    file: "garden/reference/Maine Media Outlets(Sheet 1) (1).csv"
    published_by: Cision
    license: terms_unknown
    notes: >
      412 rows, a separate pull from the 353-row file: 297 names in both,
      115 only here, 56 only there.
    columns:
      name: "Outlet Name"
      url: "Outlet Website"
      office_town: "Outlet City"
      office_county: "Outlet County"
      medium_raw: "Outlet Type"
      frequency_raw: "Outlet Frequency"
      language_raw: "Outlet Language"
      address_raw: "Outlet Address Line 1"
      zip_raw: "Outlet Zip Code"

  easton:
    file: "garden/reference/Jo Easton Maine News Outlets(Sheet1).csv"
    published_by: Jo Easton
    license: terms_unknown
    notes: >
      assembled for her own use, by her caveat. Contact names people and is
      never read. the SimilarWeb columns are a third party's estimates under
      their own terms and are not read here.
    # each entry is a prefix: a declared column starting with one is refused
    never_read: ["Contact", "Unique Users (From SimilarWeb", "Visits (From SimilarWeb", "PVs"]
    columns:
      name: "Name"
      url: "Link"
      served_raw: "Communities served"
      medium_raw: "Format"
      frequency_raw: "Format"
      business_model_raw: "Business model"
      ownership_raw: "Ownership"
      affiliation_raw: "Affiliation"

  local_news_catalyst:
    file: "garden/reference/Local News Catalyst Local News Publications(Sheet 1).csv"
    published_by: Local News Catalyst
    license: terms_unknown
    notes: >
      its seventh column has no header; it holds numbers, probably
      circulation, and is not read until its meaning is known.
    columns:
      name: "Publication"
      named_town: "City"
      named_county: "County"
      medium_raw: "Type"
      ownership_raw: "Owner"

  maine_media_ecosystem:
    file: "garden/reference/Maine Media Ecosystem(Maine Media Ecosystem).csv"
    published_by: null      # not yet known; ask before release
    license: terms_unknown
    columns:
      name: "Publication"
      url: "Digital"
      named_town: "Town"
      named_county: "County"
      medium_raw: "Medium"
      frequency_raw: "Print"
      business_model_raw: "Biz Model"
      ownership_raw: "Ownership"
    # Print is a frequency only for print media; for radio it is a format
    frequency_when:
      medium_raw: ["Newspaper", "newspaper", "College Newspaper", "Magzine"]
