# ============================================================================
# seeds/crosswalks/outlets/outlet_reviews.yml
# ============================================================================
# reviewed outlet records (D-243, D-244): a person's reading of the outlet
# listings where exact keys and declared names cannot decide. shared by
# every plot that reads these listings; a run passes it whole as `reviews`
# through $crosswalks.outlet_reviews (D-206), and freshness sees an edit.
#
# every review is keyed by a record's source and its name as written, never
# by a group id or a line: group ids follow row order and lines follow a
# copy, so a review keyed by either would follow the wrong outlet after a
# fresh copy. keyed by the words, a review lapses when the words change.
#
# what a review may do, held by prepare_news_outlets:
#   merges  join the groups of two or more records a person read as one
#           outlet. refused when the records are already one group, or when
#           no record or two records give a name. a joined group may hold
#           one source twice only when the merge says editions: in words,
#           what the person read the records as (the daily and its Sunday
#           edition, a print and an online edition). the grouping never
#           does this on its own (D-202, D-255); editions where no source
#           is twice refuses. a record a source wrote twice alike (name,
#           url, office address) is already one record (D-254)
#   towns   name the town (its ten-digit county subdivision code) a person
#           read for one record's outlet, or say state: true when the person
#           read it as serving the whole state with no town (D-257), only
#           when the run would otherwise
#           list it as towns_disagree, no_town_match, ambiguous_town,
#           no_town_given or office_shared. refused when the run places it
#           on its own (in a town or the state), when it is listed as ceased
#           or for its medium (the medium is judged first, D-248), or when
#           no record gives the name
#   office_reads
#           a person's reading of an outlet the run places by its
#           publisher's office town alone (D-256). verdict keep (it is
#           there), town (it is in the town_code read), state (it serves
#           the state, no town) or list (it is not a local outlet to count
#           here, its reason in words: a bureau, a publisher, a section).
#           refused when the run does not place the outlet by its office
#           town, when its outlet has a town review too, or when a verdict
#           is incomplete. an outlet placed by its office town with no read
#           is flagged office_town_unread, and stays placed
#
# each review names its evidence, the day it was read and who read it:
#
#   merges:
#     - records:
#         - {source: cision, name: "..."}
#         - {source: local_news_catalyst, name: "..."}
#       editions: "..."          (only when one source is held twice)
#       evidence: >
#         ...
#       read_on: "YYYY-MM-DD"
#       read_by: ...
#   towns:
#     - source: local_news_catalyst
#       name: "..."
#       town_code: "23........"
#       evidence: >
#         ...
#       read_on: "YYYY-MM-DD"
#       read_by: ...
#   office_reads:
#     - source: cision
#       name: "..."
#       verdict: keep            (keep, town, state or list)
#       town_code: "23........"  (a town verdict only)
#       reason: "..."            (a list verdict only)
#       evidence: >
#         ...
#       read_on: "YYYY-MM-DD"
#       read_by: ...
#
# none yet: the receipt's listed_outlets name the outlets worth a person's
# read, each with its reason (OUTREV-1).
# ============================================================================

from: "Maine outlet listing records that exact keys and declared names cannot decide"
to: "rewildingCities: the merge or town a person read, with the evidence"

# read 2026-11-15 (Sprint 06, session 12). every place below is where the
# outlet's newsroom, office or broadcast license is, never the towns it
# covers (SERVES-1's). each evidence names the page read. read_by says who
# read: Claude read these pages; Kalli confirms or changes each before
# publishing.

merges:
  - records:
      - {source: local_news_catalyst, name: "Portland Press Herald/Maine Sunday Telegram"}
      - {source: easton, name: "Press Herald (MTLN)"}
    evidence: >
      pressherald.com is one newsroom publishing the daily and the Maine
      Sunday Telegram, owned by the Maine Trust for Local News; the records
      share its url or its name. Before this merge Portland counted the
      Press Herald twice. Cision's two records left with Cision (D-294), so
      no source is held twice and the merge names no editions.
    read_on: "2026-11-15"
    read_by: "Claude, from the cited pages; Kalli A. Hale to confirm"
  - records:
      - {source: local_news_catalyst, name: "The County"}
      - {source: maine_media_ecosystem, name: "Star Herald"}
    editions: "The Star-Herald, folded into the combined weekly The County in January 2025"
    evidence: >
      The Star-Herald folded into the combined weekly The County in January
      2025; the ecosystem file lists both, so the merge names them as
      editions.
      The County is the combined home of the Aroostook Republican & News,
      Houlton Pioneer Times, St. John Valley Times and The Star-Herald, first
      printed as one paper on Jan. 15, 2025, offices in Presque Isle (260
      Missile Street), Houlton and Madawaska (fiddleheadfocus.com/contact-us;
      rebuild.observer-me.com/?p=287774, "Combined paper will keep same
      County coverage").
    read_on: "2026-11-15"
    read_by: "Claude, from the cited pages; Kalli A. Hale to confirm"
  - records:
      - {source: maine_media_ecosystem, name: "Maine Wire"}
      - {source: maine_media_ecosystem, name: "The Maine Wire"}
    editions: "one outlet the ecosystem file lists twice, with and without The"
    evidence: >
      The two rows name one outlet; the ecosystem file gives no town for
      either. Read as one so it is counted once.
    read_on: "2026-11-15"
    read_by: "Claude, from the cited pages; Kalli A. Hale to confirm"

  - records:
      - {source: local_news_catalyst, name: "Boothbay Register/Wiscasset Newspaper"}
      - {source: maine_media_ecosystem, name: "Boothbay Register"}
    evidence: >
      The Boothbay Register and the Wiscasset Newspaper are sold and
      subscribed as one paper from one office; Cision's Wiscasset record
      left with Cision (D-294), so no source is held twice and the merge
      names no editions.
      Subscriptions and newsstand pages name one paper, Boothbay Register /
      Wiscasset Newspaper, at 97 Townsend Ave., Boothbay Harbor 04538
      (admin.wiscassetnewspaper.com/subscriptions; boothbayregister.com/where-buy-paper);
      the Wiscasset Newspaper has been made in the Register's building since
      its start (wiscassetnewspaper.com/node/144073). The map held it three
      times: Boothbay Harbor, Boothbay and Wiscasset.
    read_on: "2026-11-15"
    read_by: "Claude, from the cited pages; Kalli A. Hale to confirm"

