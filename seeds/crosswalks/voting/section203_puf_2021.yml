# ============================================================================
# seeds/crosswalks/voting/section203_puf_2021.yml
# the Census's 2021 Section 203 public use files, as their documentation
# describes them (D-263). read by soil/transform/prepare_section203.py,
# passed whole as `reading`.
# ============================================================================
# source: "2021 Voting Rights Public Use File Technical Documentation",
# Census Redistricting & Voting Rights Data Office, 2021-12-08, inside
# Sec203_PUF_2021_12_01.zip. the file differs from it three ways, read
# 2026-11-15: its bytes are cp1252 where it says ASCII (the encoding is the
# release's own fact, in the manifest); its LANGUAGE text differs from the
# documented labels ("Apache alone or in combination" for "American Indian
# (Apache)"), so a row is keyed by LANCOUNT, never LANGUAGE, and both are
# kept; and the nation's ILLRAT reads 1.3200 where the documentation's flag
# rule says 1.31. the flags are the evidence: Census set them on unrounded,
# unsuppressed data, so they are never recomputed from the rounded values.
# ============================================================================

documentation: "2021 Voting Rights Public Use File Technical Documentation (2021-12-08)"
columns: [SUMLVL, LEVEL, S203_GEOID, AIAN, ANRC, ST, CNTY, MCD, NAMELSAD, LANCOUNT, LANGUAGE, POP, MPOP, VAPOP, MVAPOP, VACIT, MVACIT, VACLEP, MVACLEP, ILLIT, MILLIT, LEPPCT, MLEPPCT, ILLRAT, MILLRAT, FLAG10, FLAG5, FLAG_EDU, FLAG_ST, FLAG_JURIS, FLAG_AIAN, FLAG_ANRC, FLAG_COV]
numeric: [POP, MPOP, VAPOP, MVAPOP, VACIT, MVACIT, VACLEP, MVACLEP, ILLIT, MILLIT, LEPPCT, MLEPPCT, ILLRAT, MILLRAT]
flags: [FLAG10, FLAG5, FLAG_EDU, FLAG_ST, FLAG_JURIS, FLAG_AIAN, FLAG_ANRC, FLAG_COV]
# the documentation's Table 2 codes; SUMLVL is read as text
summary_levels:
  "010": nation
  "040": state
  "050": county
  "060": mcd
  "230": anrc
  "231": anrc_county
  "250": aian
  "270": aian_county
  "271": aian_mcd
# the national illiteracy rate the documentation's FLAG_EDU rule names
documented_national_illiteracy_rate: 1.31
# Table 4. 55 is no longer used and is refused if met. class says which of
# the four groups Section 203 covers a code belongs to, or that it is a total
# (the documentation writes a dash in 46, 53, 54 and 76; written here as a comma)
lancount:
  "01": {label: "Total Population", class: total}
  "02": {label: "Hispanic", class: hispanic}
  "03": {label: "American Indian alone or in combination", class: total}
  "04": {label: "American Indian (Apache)", class: american_indian_alaska_native}
