# ============================================================================
# seeds/crosswalks/addresses/usps_pub28.yml
# ============================================================================
# how two spellings of one street are made comparable: USPS Publication 28,
# Postal Addressing Standards (October 2024 edition), read 2026-11-15.
#
#   suffixes      Appendix C1, Street Suffix Abbreviations: for each primary
#                 street suffix name, the forms USPS lists as commonly used
#                 and its standard abbreviation, transcribed group by group
#                 from https://pe.usps.com/text/pub28/28apc_002.htm (206
#                 groups). every form maps to its group's primary name, so
#                 RD and ROAD are one word, and both sides of a match say
#                 the same thing however each source abbreviates
#   resolved      the forms C1 itself lists in two groups. each is declared
#                 here by a person, never by an ordering rule in code; a form
#                 in two groups that is not named here refuses the reading
#   directionals  section 233, Directionals: the eight standard directionals
#                 and their one- or two-letter abbreviations
#                 (https://pe.usps.com/text/pub28/28c2_014.htm). the words
#                 are mapped to the abbreviations; 233's own rules for where a
#                 directional sits in a street are not used, because a match
#                 maps every directional word on both sides the same way
#
# shared by every plot and every source with a street address (D-238): it
# names no plot, no state and no file. what a match is, and where it looks,
# is the method's to say; this file says only how a street is spelled.
# ============================================================================

from: "USPS Publication 28, Postal Addressing Standards, October 2024: Appendix C1 and section 233"
to: "rewildingCities: one spelling per street suffix (its primary name) and per directional"

source_scheme:
  name: Publication 28, Postal Addressing Standards
  provider: United States Postal Service
  edition: October 2024
  documentation: https://pe.usps.com/text/pub28/welcome.htm

# the forms C1 lists in two groups, each sent to one, with why
resolved:
  MDW: MEADOW       # MEADOW's standard abbreviation; only a listed form of MEADOWS
  PARK: PARK        # PARK's own name; also listed as the standard for PARKS
  SPUR: SPUR        # SPUR's own name; also listed as the standard for SPURS
  WALK: WALK        # WALK's own name; also listed as the standard for WALKS
  PKWY: PARKWAY     # the standard for both PARKWAY and PARKWAYS: USPS does not
                    # tell them apart in abbreviation, so neither can a match

directionals:
  NORTH: N
  SOUTH: S
  EAST: E
  WEST: W
  NORTHEAST: NE
  NORTHWEST: NW
  SOUTHEAST: SE
  SOUTHWEST: SW

# primary street suffix name: {standard: USPS abbreviation, forms: every form
