# ═══════════════════════════════════════════════════════════════════════════════
# seeds/indicators/news_outlets.yml
# Local news outlet carrier indicators: counts of a layer's located_in edges
# per place, over the place's own people (D-209). Their own file, one family
# per file (INDFILE-1, D-227).
# ═══════════════════════════════════════════════════════════════════════════════

indicators:

  news_outlets_per_1000:
    name: Local news outlets per 1,000 people
    defined_by: rewildingcities
    measures: news_outlets
    role: carrier
    rests_on: {add: [P1_001N], counts: persons}
    unit: per_1000_persons
    derivation:
      kind: located_count
      counts: news_outlet
      denominator: persons
      scale: 1000
    direction: higher_is_better
    aggregation: none
    uncertainty: none
    source:
      provider: rewildingcities
    rationale: >
      Counts the local news outlets placed in a place: which outlets are
      local news, which are placed, and why, is the outlet_carriers method's
      to say (D-212). An outlet is placed by town, never by a point: the
      town a listing names for it, or, by a plot's declared choice, its
      publisher's office town (D-242). So it is counted in its town, county
      and state only, never in a House or Senate district or a Census tribal
      area, since a town can lie across several (D-246). An outlet a listing
      calls statewide counts in the state alone (D-249). An outlet that no source places, or that
      its sources place in two towns, counts nowhere here and is listed with
      its reason. The denominator is the place's 2020 persons (P.L. 94-171
      P1). A small place's rate is unstable, so the count and the persons
      always travel with the rate. Aggregation none: a rate never moves
      along an edge (D-179).
