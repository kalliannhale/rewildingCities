# ═══════════════════════════════════════════════════════════════════════════════
# seeds/indicators/cii_2026_published.yml
# The Civic Information Index's 27 indicators as CII PUBLISHED them.
#
# Passthroughs, with CII itself as the authority: each value is the number in
# CII's 2026 data file, unchanged. They exist so CII's full methodology
# (imputation needs all 27; pillars average them) can run inside this system
# today, while providers for the original sources are built one by one.
#
# Beside them sit this system's own derivations from the Census of three of
# the same indicators (cii_broadband, cii_rent_burden, cii_no_vehicle), which
# agree with these at CII's precision. `measures` is shared, so
# registry.measuring() returns both: two authorities, side by side, never
# averaged.
#
# Generated from the published file's header, so no column name was typed by
# hand (L-69). Directions are the 12 reversals verified by CII-8. Aggregation
# is `none` throughout: how CII built each rate is not documented, so nothing
# here claims a rule for combining them across units.
# ═══════════════════════════════════════════════════════════════════════════════

indicators:
  cii_pub_news_outlets:
    name: Total news outlets
    defined_by: cii_2026
    measures: news_outlets
    unit: count
    derivation:
      kind: passthrough
      column: Total news outlets
    direction: higher_is_better
    aggregation: none
    uncertainty: none
    source:
      provider: civic_information_index
      dataset: cii_2026_published
    replicates:
      publisher: civic_information_index
      edition: 2026
      column: Total news outlets
