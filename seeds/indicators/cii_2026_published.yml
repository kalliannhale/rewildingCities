    replicates:
      publisher: civic_information_index
      edition: 2026
      column: Local Journalist Equivalent per 100,000 people
    rationale: CII's published values are rounded to 8 decimals while its percentiles
      were computed before rounding (CII-9). Ties in this column may not be ties.
