# ═══════════════════════════════════════════════════════════════════════════════
# seeds/indicators/health_centers.yml
# Health center carrier indicators: counts of a point layer's located_in edges
# per place, over the place's own people (D-209). Their own file, one family
# per file (INDFILE-1, D-227).
# ═══════════════════════════════════════════════════════════════════════════════

indicators:

  health_center_sites_per_1000:
    name: Health center sites per 1,000 people
    defined_by: rewildingcities
    measures: health_center_sites
    role: carrier
    rests_on: {add: [P1_001N], counts: persons}
    unit: per_1000_persons
    derivation:
      kind: located_count
      counts: health_center_site
      denominator: persons
      scale: 1000
    direction: higher_is_better
    aggregation: none
    uncertainty: none
    source:
      provider: rewildingcities
    rationale: >
      Counts the health center sites placed in a place: which sites are
      placed, and why, is the health_center_carriers method's to say
      (D-212). It names the type it counts, health_center_site; whose points
      and which day's copy are the preparation's to say (D-224). A site
      standing in a place is not whom it serves (SERVES-1). The denominator
      is the place's 2020 persons (P.L. 94-171 P1), the vintage of the
      edges. A small place's rate is unstable, so the count and the persons
      always travel with the rate. HRSA's program does not see the Wabanaki
      nations' own clinics, so a Census tribal area's count from this source
      is shown beside a note saying a zero cannot be trusted (TRIBE-7, D-233). Aggregation none: a rate
      never moves along an edge (D-179).
