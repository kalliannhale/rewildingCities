# soil/_registry.yml
# Registry for validation and preparation primitives

primitives:

  validate_boundaries:
    path: validate/validate_boundaries.R
    version: 1.0.0
    description: >
      Validate vector geometries for analytical readiness. Checks for 
      valid geometry, CRS presence, minimum area thresholds, and empty 
      features. Optionally repairs invalid geometries and reprojects 
      to target CRS.
    
    # === Standard fields (shared with roots/) ===
    
    inputs:
      - name: boundaries
        semantic_types: 
          - park_boundaries
          - water_boundaries
          - forest_boundaries
          - study_area
        required: true
        description: Vector features to validate
    
    outputs:
      semantic_type: null  # Preserves input semantic type
      data_category: vector
      description: >
        Same features, validated and optionally repaired. 
        Excluded features documented in warnings.
    
    params:
      target_crs:
        type: string
        default: null
        description: If provided, reproject to this CRS
      min_area_ha:
        type: number
        default: null
        description: Exclude features below this area threshold
      repair_invalid:
        type: boolean
        default: false
        description: Attempt to repair invalid geometries via st_make_valid
      drop_empty:
        type: boolean
        default: true
        description: Remove empty or null geometries
    
    # === Soil-specific fields ===
    
    validates:
      - id: valid_geometry
        description: Geometry passes st_is_valid()
        severity_if_failed: warning
      - id: crs_present
        description: CRS is defined, not NA
        severity_if_failed: critical
      - id: min_area
        description: Feature area meets threshold
        severity_if_failed: info
        conditional: when min_area_ha is set
      - id: no_empty_geometries
        description: Geometry is not empty or null
        severity_if_failed: warning
    
    repairs:
      - id: invalid_geometry
        method: st_make_valid
        when: repair_invalid is true
        description: Attempts topological repair of invalid geometries
      - id: crs_transform
        method: st_transform
        when: target_crs differs from input CRS
        description: Reprojects features to target coordinate system
    
    may_exclude_features: true
    exclusion_documented_in: warnings
    
  validate_vector:
    path: validate/validate_vector.R
    version: 1.0.0
    passthrough: true
    description: >
      Diagnostic primitive: validates vector layer health without modifying data.
      Checks CRS presence, geometry validity, empty geometries, and type consistency.
      Returns input path with validation metadata attached to envelope.
    
    inputs:
      - name: features
        semantic_types:
          - park_boundaries
          - water_boundaries
          - forest_boundaries
          - study_area
          - neighborhood_boundaries
          - census_tracts
          - governance_unit
          - sovereign_boundary
        required: true
        description: Vector features to diagnose
    
    outputs:
      semantic_type: null  # Preserves input semantic type
      data_category: vector
      description: >
        Same data path (passthrough). Envelope contains validation 
        diagnostics and accumulated warnings.
    
    params: {}  # No parameters — pure diagnostic
    
    validates:
      - id: crs_present
        description: CRS is defined
        severity_if_failed: critical
      - id: feature_count
        description: Layer contains at least one feature
        severity_if_failed: critical
      - id: valid_geometry
        description: Geometries pass st_is_valid()
        severity_if_failed: warning
      - id: no_empty_geometries
        description: No empty or null geometries
        severity_if_failed: warning
      - id: geometry_type_consistent
        description: Single geometry type (not mixed)
        severity_if_failed: warning
    
    repairs: []  # Diagnostic only — does not modify
    
    may_exclude_features: false

  validate_raster:
    path: validate/validate_raster.R
    version: 1.0.0
    passthrough: true
    description: >
      Validate raster data for analytical readiness. Checks CRS, 
      resolution, NoData coverage, and value ranges. Does not modify 
      raster data — validation only.
    
    inputs:
      - name: raster
        semantic_types:
          - land_surface_temperature
          - ndvi
          - land_cover
        required: true
        description: Raster to validate
    
    outputs:
      semantic_type: null  # Preserves input semantic type
      data_category: raster
      description: >
        Same raster, with validation metadata attached. 
        No transformation — envelope documents quality.
    
    params:
      expected_crs:
        type: string
        default: null
        description: Warn if raster CRS doesn't match
      max_nodata_percent:
        type: number
        default: 50
        description: Critical warning if NoData exceeds this threshold
      expected_resolution_m:
        type: number
        default: null
        description: Warn if resolution differs significantly
      value_range:
        type: object
        properties:
          min: { type: number }
          max: { type: number }
        default: null
        description: Expected value range for sanity checking
    
    validates:
      - id: crs_present
        description: CRS is defined
        severity_if_failed: critical
      - id: crs_match
        description: CRS matches expected value
        severity_if_failed: warning
        conditional: when expected_crs is set
      - id: nodata_coverage
        description: NoData percentage within acceptable bounds
        severity_if_failed: critical
        threshold_param: max_nodata_percent
      - id: resolution_match
        description: Resolution matches expected value
        severity_if_failed: info
        conditional: when expected_resolution_m is set
      - id: value_range_sane
        description: Values fall within expected range
        severity_if_failed: warning
        conditional: when value_range is set
    
    repairs: []  # validate_raster does not modify data
    
    may_exclude_features: false


  repair_geometry:
    path: repair/repair_geometry.R
    version: 1.0.0
    passthrough: false
    description: >
      Repair invalid geometries using st_make_valid(). Documents how many 
      features were repaired and warns if any remain invalid after repair.
    
    inputs:
      - name: features
        semantic_types:
          - park_boundaries
          - water_boundaries
          - forest_boundaries
          - study_area
          - governance_unit
          - sovereign_boundary
          - neighborhood_boundaries
        required: true
        description: Vector features to repair
    
    outputs:
      semantic_type: null  # Preserves input semantic type
      data_category: vector
      description: Features with repaired geometries
    
    params: {}  # No parameters — applies st_make_valid to all
    
    validates:
      - id: geometry_repairable
        description: Geometries can be repaired by st_make_valid
        severity_if_failed: warning
    
    repairs:
      - id: make_valid
        method: st_make_valid
        description: Standard topological repair
    
    may_exclude_features: false
    exclusion_documented_in: warnings

  dissolve_by_field:
    path: transform/dissolve_by_field.R
    version: 1.0.0
    passthrough: false
    description: >
      Dissolve polygons into one multipart feature per attribute value.
      Source boundary data is often held as arc-derived polygons ~ one per
      landmass, per tidal split, per island ~ while an analysis wants one
      feature per administrative unit. This is a REDUCTION: feature count
      collapses, geometry becomes multipart, and attributes that varied
      within a group are dropped. All of it is measured and reported,
      because a denominator built from the wrong grain divides by the wrong
      number and every rate inherits the error.

    inputs:
      - name: features
        semantic_types:
          - governance_unit
          - sovereign_boundary
          - study_area
          - study_boundary
          - neighborhood_boundaries
          - park_boundaries
          - water_boundaries
          - forest_boundaries
        required: true
        description: Vector features to aggregate

    outputs:
      semantic_type: null  # Preserves input semantic type
      data_category: vector
      description: >
        One multipart feature per distinct value of the dissolve field. The
        dissolve field becomes the output's id_field and spatial_unit,
        because after a dissolve it IS the key by construction.

    params:
      field:
        type: string
        required: true
        description: >
          The attribute to group by. No default: dissolving on the wrong
          field yields a plausible, silent, wrong answer.
      filters:
        type: object
        default: null
        description: >
          Attribute filters applied BEFORE the dissolve, as field -> kept
          value. Each is a semantic choice (exclude islands, exclude water)
          and each is reported with how many features it removed.
      drop_blank:
        type: boolean
        default: true
        description: >
          Drop features with no value in the dissolve field. They cannot
          belong to a unit and would otherwise collapse into one anonymous
          group.
      keep_fields:
        type: array
        default: []
        description: >
          Attributes to carry through the dissolve. Each is kept only if it is
          constant within every group; a requested field that varies within a
          unit is refused by name, because carrying it would invent a value
          for the group. Declared here after it was found in the primitive and
          missing from the registry (REG-6).
      merge:
        type: string
        default: union
        options: [union, combine]
        description: >
          union dissolves shared boundaries between a unit's parts, correct
          and slower; combine merges parts into one multipart geometry without
          resolving shared edges, identical when parts are disjoint.

  reproject_vector:
    path: transform/reproject_vector.R
    version: 1.0.0
    passthrough: false
    description: >
      Reproject vector features to a target CRS using st_transform().
      Documents source and target CRS in envelope metadata.
    
    inputs:
      - name: features
        semantic_types:
          - park_boundaries
          - water_boundaries
          - forest_boundaries
          - study_area
          - governance_unit
          - sovereign_boundary
          - neighborhood_boundaries
          - park_buffers
        required: true
        description: Vector features to reproject
    
    outputs:
      semantic_type: null  # Preserves input semantic type
      data_category: vector
      description: Features transformed to target CRS
    
    params:
      target_crs:
        type: string
        required: true
        description: Target CRS (e.g., "EPSG:2263" for NYC State Plane)
    
    validates:
      - id: source_crs_present
        description: Input has defined CRS
        severity_if_failed: critical
      - id: target_crs_valid
        description: Target CRS can be parsed
        severity_if_failed: critical
    
    repairs: []
    
    may_exclude_features: false

  assign_feature_id:
    path: validate/assign_feature_id.R
    version: 1.0.0
    description: >
      Stamp a uniform feature_id onto features from a declared source
      column. Validates the column exists and is unique and non-missing,
      so downstream joins can trust feature_id as the identity key.
    inputs:
      - name: features
        semantic_types: [park_boundaries]
        required: true
    outputs:
      semantic_type: park_boundaries_filtered
      data_category: vector
    params:
      source_field:
        type: string
        # no default — identity is never guessed

  fetch_dataset:
    path: register/fetch_dataset.R
    version: 1.0.0
    description: >
      Fetch data from remote sources (APIs, URLs) and cache locally. 
      Handles Socrata, direct downloads, and authenticated sources.
    
    inputs: []  # No data input — fetches from remote
    
    outputs:
      semantic_type: null  # Determined by manifest declaration
      data_category: null  # Determined by fetched data
      description: Fetched and cached dataset
    
    params:
      source_type:
        type: string
        enum: [socrata, url, earthengine]
        required: true
        description: Type of remote source
      endpoint:
        type: string
        required: true
        description: URL or API endpoint
      cache_path:
        type: string
        required: true
        description: Where to cache the fetched data
      force_refresh:
        type: boolean
        default: false
        description: Re-fetch even if cache exists
      auth_env_var:
        type: string
        default: null
        description: Environment variable containing auth token
    
    validates:
      - id: endpoint_reachable
        description: Remote endpoint responds
        severity_if_failed: critical
      - id: response_valid
        description: Response parses as expected format
        severity_if_failed: critical
      - id: cache_writable
        description: Can write to cache location
        severity_if_failed: critical
    
    repairs: []
    
    may_exclude_features: false
    requires_network: true
    idempotent: true  # Safe to re-run; uses cache


  check_alignment:
    path: validate/check_alignment.R
    version: 1.0.0
    description: >
      Check spatial alignment between vector and raster data. 
      Verifies CRS match, spatial overlap, and resolution appropriateness.
    
    inputs:
      - name: vector
        semantic_types:
          - park_boundaries
          - park_buffers
          - study_area
        required: true
      - name: raster
        semantic_types:
          - land_surface_temperature
          - ndvi
          - land_cover
        required: true
    
    outputs:
      semantic_type: alignment_report
      data_category: tabular
      description: Report documenting alignment status and any issues
    
    params:
      require_full_coverage:
        type: boolean
        default: false
        description: Fail if vector extends beyond raster extent
      min_overlap_percent:
        type: number
        default: 80
        description: Minimum percentage of vector covered by raster
    
    validates:
      - id: crs_match
        description: Vector and raster share same CRS
        severity_if_failed: critical
      - id: spatial_overlap
        description: Features fall within raster extent
        severity_if_failed: critical
      - id: coverage_sufficient
        description: Overlap meets minimum threshold
        severity_if_failed: warning
        threshold_param: min_overlap_percent
      - id: resolution_appropriate
        description: Raster resolution suitable for feature sizes
        severity_if_failed: info
    
    repairs: []
    
    may_exclude_features: false
  
  # ────────────────────────────────────────────────────────────
  # Added Sprint 5: primitives needed by park cooling experiment
  # ────────────────────────────────────────────────────────────

  filter_by_area:
    path: filter/filter_by_area.R
    version: 1.0.0
    passthrough: false
    description: >
      Filter vector features by area threshold. Following Xiao et al. (2023),
      parks smaller than 0.09 ha may not generate measurable cooling signatures
      at Landsat resolution.

    inputs:
      - name: features
        semantic_types:
          - park_boundaries
          - water_boundaries
          - forest_boundaries
        required: true
        description: Vector features to filter by area

    outputs:
      semantic_type: null  # Preserves input semantic type
      data_category: vector
      description: Features meeting area criteria

    params:
      min_area_ha:
        type: number
        default: 0
        description: Exclude features below this area (hectares)
      max_area_ha:
        type: number
        default: null
        description: Exclude features above this area (hectares)

    validates:
      - id: features_remain
        description: At least one feature passes the filter
        severity_if_failed: critical

    repairs: []
    may_exclude_features: true
    exclusion_documented_in: warnings

  scale_raster:
    path: convert/scale_raster.R
    version: 1.0.0
    passthrough: false
    description: >
      Apply scale/offset conversion to raster values.
      new = (old * scale) + offset. Primary use: Landsat DN to Celsius.
      Documents the unit transformation in the envelope.

    inputs:
      - name: raster
        semantic_types:
          - land_surface_temperature
          - ndvi
        required: true
        description: Raster to convert

    outputs:
      semantic_type: null  # Preserves input semantic type
      data_category: raster
      description: Raster with converted values

    params:
      scale:
        type: number
        default: 1
        description: Multiplicative scale factor
      offset:
        type: number
        default: 0
        description: Additive offset (applied after scale)
      from_unit:
        type: string
        default: "unknown"
        description: Source unit (e.g., "landsat_dn", "kelvin")
      to_unit:
        type: string
        default: "unknown"
        description: Target unit (e.g., "celsius")
      conversion:
        type: string
        default: null
        description: Named conversion shortcut (e.g., "kelvin_to_celsius")

    validates:
      - id: values_finite
        description: Output values are not all NaN/Inf
        severity_if_failed: warning

    repairs: []
    may_exclude_features: false

  reproject_raster:
    path: transform/reproject_raster.R
    version: 1.0.0
    passthrough: false
    description: >
      Reproject a raster to a target CRS. Documents source and target CRS
      in envelope metadata.

    inputs:
      - name: raster
        semantic_types:
          - land_surface_temperature
          - ndvi
          - land_cover
        required: true
        description: Raster to reproject

    outputs:
      semantic_type: null  # Preserves input semantic type
      data_category: raster
      description: Raster transformed to target CRS

    params:
      target_crs:
        type: string
        required: true
        description: Target CRS (e.g., "EPSG:2263")
      method:
        type: string
        default: "bilinear"
        options: ["near", "bilinear", "cubic", "cubicspline"]
        description: Resampling method

    validates:
      - id: source_crs_present
        description: Input raster has defined CRS
        severity_if_failed: critical
      - id: target_crs_valid
        description: Target CRS can be parsed
        severity_if_failed: critical

    repairs: []
    may_exclude_features: false

  crop_to_boundary:
    path: scope/crop_to_boundary.R
    version: 1.0.0
    passthrough: false
    description: >
      Crop a raster to a vector boundary extent with optional buffer.
      Ensures the raster covers the analysis area without excess data.

    inputs:
      - name: raster
        semantic_types:
          - land_surface_temperature
          - ndvi
          - land_cover
        required: true
        description: Raster to crop
      - name: boundary
        semantic_types:
          - park_boundaries
          - study_boundary
          - neighborhood_boundaries
        required: true
        description: Vector boundary defining crop extent

    outputs:
      semantic_type: null  # Preserves input semantic type
      data_category: raster
      description: Raster cropped to boundary extent

    params:
      buffer_m:
        type: number
        default: 0
        description: Buffer distance (meters) to add around boundary before cropping
      snap:
        type: string
        default: "out"
        options: ["out", "in", "near"]
        description: How to snap crop extent to raster grid

    validates:
      - id: crs_match
        description: Raster and boundary CRS are compatible
        severity_if_failed: critical
      - id: spatial_overlap
        description: Boundary falls within raster extent
        severity_if_failed: critical

    repairs: []
    may_exclude_features: false
  
  # --- sample/ ---
  # Subsampling primitives for fast iteration. Injected by the
  # orchestrator when a profile enables feature_sampling.

  sample_features:
    path: scope/sample_features.R
    version: 1.0.0
    passthrough: false
    description: >
      Subsample vector features for faster iteration. Supports
      random, stratified, first_n, filtered, and explicit selection.
      Documents sampling method, resolved field names, and parameters
      in the envelope for full reproducibility.

      Typically injected by the orchestrator when a profile enables
      feature_sampling, but can be used directly in an experiment
      step if a user wants explicit control over the sampling DAG
      position.
    inputs:
      - name: features
        semantic_types:
          - park_boundaries
          - park_boundaries_filtered
          - park_boundaries_reprojected
          - park_boundaries_repaired
          - park_boundaries_checked
          - water_boundaries
          - forest_boundaries
          - study_boundary
          - city_boundary
        required: true
    outputs:
      semantic_type: null   # preserves input semantic type
      data_category: vector
    params:
      method:
        type: string
        default: "random"
        options: [random, stratified, first_n, filtered, explicit]
      n:
        type: integer
        default: 50
      n_per_stratum:
        type: integer
        default: 5
      stratify_by:
        type: string
        default: "auto"
      seed:
        type: integer
        default: 42
      filter:
        type: string
        default: null
      feature_ids:
        type: array
        default: null
    validates: []
    repairs: []
    may_exclude_features: true
    exclusion_documented_in: warnings

  # soil/_registry.yml — consolidated additions (append under `primitives:`)
# Complete as of the deep-branch build. Supersedes all inline soil snippets.

  solve_intrinsics:
    path: calibrate/solve_intrinsics.py
    version: 1.0.0
    description: Solve pinhole intrinsics + distortion from checkerboard frames.
    inputs:
      - {name: images, semantic_types: [ground_photograph], required: true}
    outputs: {semantic_type: camera_intrinsics, data_category: tabular}
    params:
      board_cols: {type: integer}
      board_rows: {type: integer}
      square_size: {type: number, default: 1.0}
      square_units: {type: string, default: "board_squares"}
      fix_aspect_ratio: {type: boolean, default: false}
      drop_outlier_mad: {type: number, default: null}
      detect_downscale_width: {type: integer, default: 1000}
      subpix_window: {type: integer, default: 11}
      subpix_max_iter: {type: integer, default: 30}
      subpix_eps: {type: number, default: 0.001}

  recover_ground_pose:
    path: calibrate/recover_ground_pose.py
    version: 1.0.0
    description: Recover ground-plane pose (rvec/tvec) from a flat board via solvePnP.
    inputs:
      - {name: image, semantic_types: [ground_photograph], required: true}
      - {name: intrinsics, semantic_types: [camera_intrinsics], required: true}
    outputs: {semantic_type: ground_pose, data_category: tabular}
    params:
      board_cols: {type: integer}
      board_rows: {type: integer}
      square_size: {type: number, default: 1.0}
      detect_downscale_width: {type: integer, default: 1000}
      subpix_window: {type: integer, default: 11}
      subpix_max_iter: {type: integer, default: 30}
      subpix_eps: {type: number, default: 0.001}
      reproj_warn: {type: number, default: 1.0}
      reproj_critical: {type: number, default: 2.0}

  rectify_to_ground:
    path: transform/rectify_to_ground.py
    version: 1.0.0
    description: IPM warp of an image-plane raster to the ground plane over a bounded extent.
    inputs:
      - {name: image, semantic_types: [land_cover_prediction, land_cover_labels, ground_photograph], required: true}
      - {name: intrinsics, semantic_types: [camera_intrinsics], required: true}
      - {name: pose, semantic_types: [ground_pose], required: true}
    outputs: {semantic_type: rectified_land_cover, data_category: raster}
    params:
      ground_extent: {type: array, default: null}
      output_scale: {type: number, default: 50}
      nodata_value: {type: integer, default: 255}
      input_kind: {type: string, default: "mask", options: [mask, rgb]}
      undistort: {type: boolean, default: true}

  resolve_scribble_labels:
    path: classify/resolve_scribble_labels.py
    version: 1.1.0
    description: Decode a painted RGB scribble mask to canonical 7-class ids via a seeds crosswalk; count-based stray-class guard.
    inputs:
      - {name: scribble, semantic_types: [scribble_labels], required: true}
    outputs: {semantic_type: land_cover_labels, data_category: raster}
    params:
      crosswalk: {type: string}
      tolerance: {type: number, default: 30}
      min_class_px: {type: integer, default: 20}

  featurize_frame:
    path: classify/featurize_frame.py
    version: 1.0.0
    description: Turn a frame (+optional class-id mask) into a per-pixel feature_table via rgb_landcover_features.
    inputs:
      - {name: image, semantic_types: [ground_photograph], required: true}
      - {name: labels, semantic_types: [land_cover_labels], required: false}
    outputs: {semantic_type: feature_table, data_category: tabular}
    params:
      mode: {type: string, default: "labeled", options: [labeled, all]}
      texture_window: {type: integer, default: 7}
      work_max: {type: integer, default: 1024}
      frame_id: {type: string, default: null}
      nodata: {type: integer, default: 0}

  segment_rf:
    path: classify/segment_rf.py
    version: 1.1.0
    description: Classical RF land-cover segmenter; fits inline on a frame's scribbles, or applies a supplied model. Shared rgb_landcover_features.
    inputs:
      - {name: image, semantic_types: [ground_photograph], required: true}
      - {name: labels, semantic_types: [land_cover_labels], required: false}
      - {name: model, semantic_types: [classifier_model], required: false}
    outputs: {semantic_type: land_cover_prediction, data_category: raster}
    params:
      n_estimators: {type: integer, default: 200}
      max_depth: {type: integer, default: null}
      texture_window: {type: integer, default: 7}
      conf_warn: {type: number, default: 0.6}
      work_max: {type: integer, default: 1024}
      class_names: {type: object, default: null}

  segment_deep:
    path: classify/segment_deep.py
    version: 1.1.0
    description: Deep segmenter; loads a train_segmenter_head weights bundle via deep_backbone and predicts, else an honest untrained stub.
    inputs:
      - {name: image, semantic_types: [ground_photograph], required: true}
    outputs: {semantic_type: land_cover_prediction, data_category: raster}
    params:
      weights: {type: string, default: "pretrained"}
      device: {type: string, default: "auto"}
      work_max: {type: integer, default: 1024}
      conf_warn: {type: number, default: 0.6}
      class_names: {type: object, default: null}

  train_segmenter_head:
    path: classify/train_segmenter_head.py
    version: 1.0.0
    description: Transfer-learning loop; remap an ADE20K corpus to 0-7 codes via the corpus crosswalk, train the deep head (backbone frozen), save a weights bundle segment_deep loads.
    inputs:
      - {name: images, semantic_types: [ground_photograph], required: true}
      - {name: labels, semantic_types: [land_cover_labels], required: true}
    outputs: {semantic_type: classifier_model, data_category: tabular}
    params:
      crosswalk: {type: string}
      corpus_label_map: {type: string}
      backbone: {type: string, default: "deeplabv3_resnet50"}
      num_classes: {type: integer, default: 8}
      epochs: {type: integer, default: 10}
      lr: {type: number, default: 0.001}
      batch_size: {type: integer, default: 4}
      input_size: {type: integer, default: 384}
      freeze_backbone: {type: boolean, default: true}
      device: {type: string, default: "auto"}
      val_frac: {type: number, default: 0.1}
      seed: {type: integer, default: 0}
      max_images: {type: integer, default: null}

  split_dataset:
    path: scope/split_dataset.py
    version: 1.0.0
    description: General train/test/val split over an abstract sample_index; leakage-aware strategies.
    inputs:
      - {name: samples, semantic_types: [sample_index], required: true}
    outputs: {semantic_type: dataset_partition, data_category: tabular}
    params:
      strategy: {type: string, default: "grouped", options: [random, stratified, grouped, spatial, temporal]}
      test_frac: {type: number, default: 0.2}
      val_frac: {type: number, default: 0.0}
      seed: {type: integer, default: 42}
      id_col: {type: string, default: "id"}
      stratify_by: {type: string, default: null}
      group_by: {type: string, default: null}
      block_size: {type: number, default: null}
      x_col: {type: string, default: "x"}
      y_col: {type: string, default: "y"}
      time_col: {type: string, default: null}

  assign_geoid:
    path: transform/assign_geoid.R
    version: 0.1.0
    passthrough: false
    description: >
      A Census GEOID on a boundary layer, derived from the layer's own county
      code: the state FIPS followed by the county code zero-padded. Turns a
      join to Census-keyed tables into a recorded derivation rather than a
      match on county names. Refuses non-numeric codes, codes wider than
      declared, duplicate GEOIDs (dissolve first), and an output field that
      already exists.
    inputs:
      - name: boundaries
        semantic_types:
          - governance_unit
        required: true
        description: Vector features carrying a county code field, one per county
    outputs:
      semantic_type: null  # Preserves input semantic type
      data_category: vector
      description: The same features, with a GEOID field added and declared as id_field
    params:
      state_fips:
        type: string
        required: true
        description: Two-digit state FIPS, e.g. "23" for Maine
      county_field:
        type: string
        required: true
        description: The field holding the county code, e.g. CNTYCODE
      county_width:
        type: integer
        default: 3
      output_field:
        type: string
        default: GEOID
    preconditions:
      - no_unresolved_critical: true

  derive_indicator:
    # moved from roots/ in Sprint 01 (D-99): deriving a value applies a
    # declared definition and asks no question, so it is preparation.
    # its name is unchanged, so provenance_contains: derive_indicator
    # (standardize_indicator's precondition) still matches.
    path: transform/derive_indicator.R
    version: 0.1.0
    description: >
      Indicator values from raw published counts, by declaration. Each
      indicator arrives as `$indicators.<id>`, resolved by the orchestrator
      from seeds/indicators/, so the primitive does only the arithmetic it is
      told: a ratio of summed numerators over a denominator at a declared
      scale, or a published column passed through. Long-form output, one row
      per unit and indicator, carrying (unit, indicator, value, authority,
      method, time). Ratio rows carry no derived margin of error; a
      passthrough carries its published one.
    inputs:
      - name: source
        semantic_types: [indicator_source]
        required: true
        description: Raw published estimates with a GEOID column
    outputs:
      semantic_type: indicator_values
      data_category: tabular
    params:
      indicators:
        type: array
        description: "Declarations, each written as $indicators.<id>"
      spatial_unit:
        type: string
        description: "What each row is, e.g. county"
      time:
        type: string
        default: null
        description: "The source's vintage window"
      authority:
        type: string
        default: null
        description: "Who published the source"
      reliability:
        type: object
        default: null
        description: "The declared small-sample rule, written as $reliability.<id> (D-106)"
      joins_to:
        type: string
        default: null
        description: "Semantic type of the units the table joins to, for mapping"
    preconditions:
      - no_unresolved_critical: true

  # ── the ownership chain (Sprint 02, item 5) ───────────────────────────────
  # both ready the outlets and answer no question, so both are soil/. they
  # were in soil/validate/ but unregistered, so nothing could run them.
  resolve_ownership:
    path: validate/resolve_ownership.py
    version: 1.0.0
    description: >
      Resolves raw owner strings to canonical owner entities through an
      auditable crosswalk. Case and whitespace are normalized automatically;
      every real merge is a crosswalk row with a confidence flag; near
      duplicates not in the crosswalk are suggested, never merged. Raw values
      are kept beside the resolved ones.
    inputs:
      - name: outlets
        semantic_types: [formal_outlet]
        required: true
        description: Outlets with a raw owner field
      - name: crosswalk
        semantic_types: [owner_crosswalk]
        required: true
        description: raw, owner_entity, confidence, note
    outputs:
      semantic_type: formal_outlet
      data_category: tabular
    params:
      owner_field: {type: string, default: "Ownership"}
      output_field: {type: string, default: "owner_entity"}
      confidence_field: {type: string, default: "owner_confidence"}
      unrecorded_label: {type: string, default: "Not recorded"}
      suggest_fuzzy: {type: boolean, default: true}
      fuzzy_cutoff: {type: number, default: 0.88}

  geocode_to_unit:
    path: validate/geocode_to_unit.py
    version: 1.0.0
    description: >
      Assigns each outlet to a governance unit's feature_id by matching its
      place-name field against the units' names, at a declared level, with an
      optional finer fallback field whose parent is taken. Every match records
      how it was made (match_source). No place names are written in the code.
    inputs:
      - name: outlets
        semantic_types: [formal_outlet]
        required: true
        description: Outlets carrying place-name fields
      - name: units
        semantic_types: [governance_unit]
        required: true
        description: feature_id, unit_name, unit_level, parent_name
    outputs:
      semantic_type: formal_outlet
      data_category: tabular
    params:
      target_level: {type: string, default: "county"}
      name_field: {type: string, default: "County"}
      fallback_field: {type: string, default: null}
      fuzzy: {type: boolean, default: true}
      fuzzy_cutoff: {type: number, default: 0.8}

  # ── the geography graph (Sprint 04, Contract 3) ───────────────────────────
  build_block_spine:
    path: transform/build_block_spine.py
    version: 1.0.0
    description: >
      One row per 2020 block with its counts (P.L. 94-171), its town (2024 faces
      when given, D-126; else the 2020 block assignment file) and its tribal area
      (2020 block assignment file) and House and Senate district
      (2024 block equivalency files; the 2020 file's districts predate 2021
      and are never read). Refuses a block with no assignment or two.
    inputs:
      - {name: counts, semantic_types: [census_block_counts], required: true}
      - {name: baf, semantic_types: [block_assignment], required: true}
      - {name: bef_sldl, semantic_types: [block_assignment], required: true}
      - {name: bef_sldu, semantic_types: [block_assignment], required: true}
      - {name: faces, semantic_types: [census_faces], required: false}   # D-126: 2024 towns
    outputs: {semantic_type: block_spine, data_category: tabular}
    params:
      state_fips: {type: string, required: true}

  assign_blocks_to_polygons:
    path: transform/assign_blocks_to_polygons.py
    version: 1.0.0
    description: >
      Each block to the polygon containing its internal point (D-122). A
      point in no polygon is counted and left unassigned; one in two is
      refused by name.
    inputs:
      - {name: points, semantic_types: [census_block_points], required: true}
      - {name: polygons, semantic_types: [governance_unit], required: true}
    outputs: {semantic_type: block_division_assignment, data_category: tabular}
    params:
      key_field: {type: string, required: true}
      output_name: {type: string, default: division}

  build_place_edges:
    path: transform/build_place_edges.py
    version: 1.0.0
    description: >
      The graph's edges from the block spine: contains from GEOID nesting;
      overlaps from block sums with both weights (D-121), each chamber and
      tribal areas under their own authority (GRAPH-1). Refuses a town in two
      counties, or shares that do not sum to 1 per chamber and basis.
    inputs:
      - {name: spine, semantic_types: [block_spine], required: true}
      - {name: divisions, semantic_types: [block_division_assignment], required: false}
    outputs: {semantic_type: place_edges, data_category: tabular}
    params:
      state_fips: {type: string, required: true}
      vintages: {type: object, required: true}
      division_authority: {type: string, default: megis}
    preconditions:
      - no_unresolved_critical: true

