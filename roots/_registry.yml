# ============================================================
# roots/_registry.yml
# Additions for the thermal analysis toolkit
# Append these entries to the existing registry
# ============================================================

primitives:

  # --- statistics/ ---

  local_gi_star:
    path: statistics/local_gi_star.R
    version: 1.0.0
    description: >
      Compute Getis-Ord Gi* z-scores for spatial autocorrelation.
      Identifies whether each cell's neighborhood has significantly
      higher or lower values than expected under spatial randomness.
    inputs:
      - name: raster
        semantic_types: [land_surface_temperature, gi_star_z_scores]
        required: true
    outputs:
      semantic_type: gi_star_z_scores
      data_category: raster
    params:
      weights_type:
        type: string
        default: "distance_band"
        options: ["distance_band", "queen"]
      distance_m:
        type: integer
        default: 200
        description: "Distance band radius in meters (only used when weights_type is distance_band)"

  classify_clusters:
    path: statistics/classify_clusters.R
    version: 1.0.0
    description: >
      Classify a z-score raster into hot spot, cold spot, and
      not-significant categories at specified confidence levels.
      Tiers are exclusive (99% cells are not double-counted in 95%).
      Produces a classified raster and a summary CSV as secondary output.
    inputs:
      - name: z_scores
        semantic_types: [gi_star_z_scores]
        required: true
    outputs:
      semantic_type: thermal_hotspot_classification
      data_category: raster
    params:
      confidence_levels:
        type: array
        default: [0.90, 0.95, 0.99]
      classification_mode:
        type: string
        default: "standard_three_tier"
        options: ["standard_three_tier", "binary"]
  
  # geometry/

  generate_buffers:
    path: geometry/generate_buffers.R
    version: 1.0.0
    description: Generate concentric buffer rings around features
    inputs:
      - name: parks
        semantic_types: [park_boundaries]
        required: true
    outputs:
      semantic_type: park_buffers
      data_category: vector
    params:
      distances:
        type: array
        items: integer
        default: [30, 60, 90, 120, 150]
      dissolve:
        type: boolean
        default: false
      id_field:
        type: string
        default: null
  
  # metrics/

  zonal_statistics:
    path: metrics/zonal_statistics.R
    version: 1.0.0
    description: Extract raster statistics within vector zones
    inputs:
      - name: zones
        semantic_types: [park_buffers, park_boundaries]
        required: true
      - name: raster
        semantic_types: [land_surface_temperature, ndvi, land_cover]
        required: true
    outputs:
      semantic_type: zonal_statistics
      data_category: tabular
    params:
      stats:
        type: array
        items: string
        default: [median, mean, min, max]
  
  calculate_pci:
    path: metrics/calculate_pci.R
    version: 1.0.0
    description: >
      Calculate Park Cooling Intensity via TPM-M gradient walk.
      Takes zonal statistics (LST per buffer ring per feature) and
      feature-interior LST, identifies the turning point where cooling
      influence ends, and computes PCI for each feature.
      TPM-M: PCI = LST_at_first_local_max - LST_inside_feature.
 
    inputs:
      - name: ring_stats
        semantic_types: [zonal_statistics]
        required: true
        description: Temperature statistics per buffer ring per feature
      - name: feature_stats
        semantic_types: [zonal_statistics]
        required: true
        description: Temperature statistics inside each feature (baseline)
 
    outputs:
      semantic_type: pci_results
      data_category: tabular
      description: >
        Per-feature PCI value, turning point distance, park LST,
        and turning point LST
 
    params:
      method:
        type: string
        default: "TPM-M"
        options: ["TPM-M", "TPM-A"]
        description: PCI estimation method
      min_rings:
        type: integer
        default: 2
        description: Minimum buffer rings before turning point can be declared
      lst_column:
        type: string
        default: "lst_median"
        description: Column name for LST values in the stats tables
  
  # roots/_registry.yml  — consolidated additions (append under `primitives:`)
# Supersedes every inline roots registry snippet pasted in chat.

  # --- ml (general) ---
  train_classifier:
    path: statistics/train_classifier.py
    version: 1.0.0
    description: Fit a classifier (random_forest|gradient_boost|logistic) on a feature_table; save a model bundle. General.
    inputs:
      - {name: table, semantic_types: [feature_table], required: true}
    outputs: {semantic_type: classifier_model, data_category: tabular}
    params:
      estimator: {type: string, default: "random_forest", options: [random_forest, gradient_boost, logistic]}
      label_col: {type: string, default: "label"}
      feature_cols: {type: array, default: null}
      exclude_cols: {type: array, default: ["id", "frame", "partition", "x", "y"]}
      n_estimators: {type: integer, default: 200}
      max_depth: {type: integer, default: null}
      seed: {type: integer, default: 0}
      class_weight: {type: string, default: null}

  apply_classifier:
    path: statistics/apply_classifier.py
    version: 1.0.0
    description: Apply a classifier_model to a feature_table; bind features by name; predictions out. General.
    inputs:
      - {name: model, semantic_types: [classifier_model], required: true}
      - {name: table, semantic_types: [feature_table], required: true}
    outputs: {semantic_type: predictions, data_category: tabular}
    params:
      id_col: {type: string, default: "id"}
      proba: {type: boolean, default: true}

  # --- metrics ---
  score_segmenters:
    path: metrics/score_segmenters.py
    version: 1.0.0
    description: Per-class accuracy, mean IoU, Cohen's Kappa for RF and optional deep vs a truth mask; RF-only if deep absent.
    inputs:
      - {name: truth, semantic_types: [land_cover_labels], required: true}
      - {name: pred_rf, semantic_types: [land_cover_prediction], required: true}
      - {name: pred_deep, semantic_types: [land_cover_prediction], required: false}
    outputs: {semantic_type: segmenter_comparison, data_category: tabular}
    params:
      nodata: {type: integer, default: 0}
      class_names: {type: object, default: null}

  score_composition:
    path: metrics/score_composition.py
    version: 1.0.0
    description: Falsification score for a known-geometry target; raw vs rectified vs truth fraction with coverage guard.
    inputs:
      - {name: pose, semantic_types: [ground_pose], required: true}
      - {name: intrinsics, semantic_types: [camera_intrinsics], required: true}
    outputs: {semantic_type: composition_falsification, data_category: tabular}
    params:
      ground_extent: {type: array}
      target_extent: {type: array}
      coverage_fraction: {type: number, default: 1.0}
      coverage_min: {type: number, default: 0.5}
      target_name: {type: string, default: "board"}
  
  cooling_differential:
    path: metrics/cooling_differential.py
    version: 1.0.0
    description: >
      Forest-vs-open surface-temperature differential: mask LST by land-cover
      class (land cover majority-resampled onto the LST grid), report the
      open-minus-forest median/mean LST. Relative, robust to absolute LST bias.
    inputs:
      - {name: lst, semantic_types: [land_surface_temperature], required: true}
      - {name: land_cover, semantic_types: [land_cover], required: true}
    outputs: {semantic_type: cooling_differential, data_category: tabular}
    params:
      forest_classes: {type: array, default: [10]}
      open_classes: {type: array, default: [30, 40]}
      central_tendency: {type: string, default: "median", options: [median, mean]}
      lst_nodata: {type: number, default: null}
      lc_nodata: {type: integer, default: 0}
      min_pixels: {type: integer, default: 20}
  
  train_regressor:
    path: statistics/train_regressor.py
    version: 1.0.0
    description: Fit a regressor (random_forest|linear|gradient_boost) on a feature_table with a continuous target; report coefficients/importances (dominant factors). Guards compositional collinearity. General.
    inputs:
      - {name: table, semantic_types: [feature_table], required: true}
    outputs: {semantic_type: regressor_model, data_category: tabular}
    params:
      estimator: {type: string, default: "random_forest", options: [random_forest, linear, gradient_boost]}
      target_col: {type: string, default: "lst"}
      feature_cols: {type: array, default: null}
      exclude_cols: {type: array, default: ["id", "x", "y", "partition"]}
      n_estimators: {type: integer, default: 300}
      max_depth: {type: integer, default: null}
      seed: {type: integer, default: 0}

  apply_regressor:
    path: statistics/apply_regressor.py
    version: 1.0.0
    description: Apply a regressor_model to a feature_table; bind features by name; continuous predictions out. General.
    inputs:
      - {name: model, semantic_types: [regressor_model], required: true}
      - {name: table, semantic_types: [feature_table], required: true}
    outputs: {semantic_type: predictions, data_category: tabular}
    params:
      id_col: {type: string, default: "id"}

  score_regression:
    path: metrics/score_regression.py
    version: 1.0.0
    description: Held-out R2, RMSE, MAE between predicted and true continuous target.
    inputs:
      - {name: pred, semantic_types: [predictions], required: true}
      - {name: truth, semantic_types: [feature_table], required: true}
    outputs: {semantic_type: regression_skill, data_category: tabular}
    params:
      id_col: {type: string, default: "id"}
      pred_col: {type: string, default: "pred"}
      truth_col: {type: string, default: "lst"}

  buffer_landcover_features:
    path: metrics/buffer_landcover_features.py
    version: 1.0.0
    description: Sample points across an LST scene; per point, blue-green-grey land-cover fractions within a buffer (land cover majority-resampled to LST grid) + point LST. Feature table for the predictive thermal model.
    inputs:
      - {name: lst, semantic_types: [land_surface_temperature], required: true}
      - {name: land_cover, semantic_types: [land_cover], required: true}
    outputs: {semantic_type: feature_table, data_category: tabular}
    params:
      n_samples: {type: integer, default: 1500}
      buffer_radius_m: {type: number, default: 100}
      seed: {type: integer, default: 0}
      bgg_mapping: {type: object, default: null}
      lst_nodata: {type: number, default: null}
      lc_nodata: {type: integer, default: 0}
      min_buffer_valid: {type: integer, default: 10}

  space_cooling_potential:
    path: metrics/space_cooling_potential.py
    version: 1.0.0
    description: Estimate a photographed space's relative cooling potential from its (rectified) blue-green-grey composition and the satellite-derived land-cover/temperature relationship. Estimate, not measurement.
    inputs:
      - {name: mask, semantic_types: [land_cover_prediction, rectified_land_cover, land_cover_labels], required: true}
    outputs: {semantic_type: space_cooling_estimate, data_category: tabular}
    params:
      class_to_bgg: {type: object, default: null}
      cooling_weights: {type: object, default: null}
      space_id: {type: string, default: null}
      nodata: {type: integer, default: 0}
  
  # ============================================================
# roots/_registry.yml  — consolidated additions
# Append these entries under the existing `primitives:` block.
# House format (expanded inputs/outputs/params). Covers every roots
# primitive built since the thermal toolkit: general ML (statistics/)
# and the analysis metrics (metrics/).
# ============================================================

  # --- statistics/  (general learning; ML is statistics) ---

  train_classifier:
    path: statistics/train_classifier.py
    version: 1.0.0
    description: >
      Fit a classifier (random_forest by default) on a tabular feature set with
      a discrete label column. General; no domain assumptions.
    inputs:
      - name: table
        semantic_types: [feature_table]
        required: true
    outputs:
      semantic_type: classifier_model
      data_category: tabular
    params:
      estimator:
        type: string
        default: "random_forest"
        options: ["random_forest"]
      label_col:
        type: string
        default: "label"
      feature_cols:
        type: array
        default: null
      n_estimators:
        type: integer
        default: 200
      max_depth:
        type: integer
        default: null
      seed:
        type: integer
        default: 0

  apply_classifier:
    path: statistics/apply_classifier.py
    version: 1.0.0
    description: >
      Apply a saved classifier_model to a feature_table; binds features by name
      and fails loudly on a missing column.
    inputs:
      - name: model
        semantic_types: [classifier_model]
        required: true
      - name: table
        semantic_types: [feature_table]
        required: true
    outputs:
      semantic_type: predictions
      data_category: tabular
    params:
      id_col:
        type: string
        default: "id"

  train_regressor:
    path: statistics/train_regressor.py
    version: 1.0.0
    description: >
      Fit a regressor (random_forest | linear | gradient_boost) on a
      feature_table with a continuous target; reports coefficients/importances
      (dominant factors) and guards compositional collinearity via the design
      condition number.
    inputs:
      - name: table
        semantic_types: [feature_table]
        required: true
    outputs:
      semantic_type: regressor_model
      data_category: tabular
    params:
      estimator:
        type: string
        default: "random_forest"
        options: ["random_forest", "linear", "gradient_boost"]
      target_col:
        type: string
        default: "lst"
      feature_cols:
        type: array
        default: null
      exclude_cols:
        type: array
        default: ["id", "x", "y", "partition"]
      n_estimators:
        type: integer
        default: 300
      max_depth:
        type: integer
        default: null
      seed:
        type: integer
        default: 0

  apply_regressor:
    path: statistics/apply_regressor.py
    version: 1.0.0
    description: >
      Apply a saved regressor_model to a feature_table; continuous predictions.
    inputs:
      - name: model
        semantic_types: [regressor_model]
        required: true
      - name: table
        semantic_types: [feature_table]
        required: true
    outputs:
      semantic_type: predictions
      data_category: tabular
    params:
      id_col:
        type: string
        default: "id"

  # --- metrics/  (scoring + analysis) ---

  score_segmenters:
    path: metrics/score_segmenters.py
    version: 1.0.0
    description: >
      Per-class and macro accuracy, mIoU, and Cohen's Kappa between predicted
      land-cover masks and truth, on the jointly-valid region. Scores one or
      two segmenters (pred_rf and optional pred_deep) against the same truth.
    inputs:
      - name: truth
        semantic_types: [land_cover_labels]
        required: true
      - name: pred_rf
        semantic_types: [land_cover_prediction]
        required: true
      - name: pred_deep
        semantic_types: [land_cover_prediction]
        required: false
    outputs:
      semantic_type: segmentation_metrics
      data_category: tabular
    params:
      nodata:
        type: integer
        default: 0

  score_composition:
    path: metrics/score_composition.py
    version: 1.0.0
    description: >
      IPM falsification: compares image-plane land-cover fractions to the
      rectified (ground-truth-geometry) fractions and returns a verdict on
      whether the perspective view misrepresents composition.
    inputs:
      - name: raw
        semantic_types: [land_cover_prediction]
        required: true
      - name: rectified
        semantic_types: [rectified_land_cover]
        required: true
    outputs:
      semantic_type: composition_validity
      data_category: tabular
    params:
      nodata:
        type: integer
        default: 255

  score_regression:
    path: metrics/score_regression.py
    version: 1.0.0
    description: >
      Held-out regression skill (R2, RMSE, MAE) between predicted and true
      continuous values. The number that makes an analysis predictive rather
      than descriptive.
    inputs:
      - name: pred
        semantic_types: [predictions]
        required: true
      - name: truth
        semantic_types: [feature_table]
        required: true
    outputs:
      semantic_type: regression_skill
      data_category: tabular
    params:
      id_col:
        type: string
        default: "id"
      pred_col:
        type: string
        default: "pred"
      truth_col:
        type: string
        default: "lst"

  cooling_differential:
    path: metrics/cooling_differential.py
    version: 1.0.0
    description: >
      Forest-vs-open surface-temperature differential: mask LST by land-cover
      class (land cover majority-resampled onto the LST grid) and report the
      open-minus-forest median/mean LST. Relative, robust to absolute LST bias.
    inputs:
      - name: lst
        semantic_types: [land_surface_temperature]
        required: true
      - name: land_cover
        semantic_types: [land_cover]
        required: true
    outputs:
      semantic_type: cooling_differential
      data_category: tabular
    params:
      forest_classes:
        type: array
        default: [10]
      open_classes:
        type: array
        default: [30, 40]
      central_tendency:
        type: string
        default: "median"
        options: ["median", "mean"]
      lst_nodata:
        type: number
        default: null
      lc_nodata:
        type: integer
        default: 0
      min_pixels:
        type: integer
        default: 20

  buffer_landcover_features:
    path: metrics/buffer_landcover_features.py
    version: 1.0.0
    description: >
      Sample points across an LST scene; per point compute blue-green-grey
      land-cover fractions within a buffer (land cover majority-resampled to the
      LST grid) plus the point LST. Feature table for the predictive thermal model.
    inputs:
      - name: lst
        semantic_types: [land_surface_temperature]
        required: true
      - name: land_cover
        semantic_types: [land_cover]
        required: true
    outputs:
      semantic_type: feature_table
      data_category: tabular
    params:
      n_samples:
        type: integer
        default: 1500
      buffer_radius_m:
        type: number
        default: 100
      seed:
        type: integer
        default: 0
      bgg_mapping:
        type: object
        default: null
      lst_nodata:
        type: number
        default: null
      lc_nodata:
        type: integer
        default: 0
      min_buffer_valid:
        type: integer
        default: 10

  space_cooling_potential:
    path: metrics/space_cooling_potential.py
    version: 1.1.0
    description: >
      Estimate a photographed space's relative cooling potential from its
      (rectified) land-cover composition, weighted at the 7-class level. An
      estimate, not a measured temperature; the output is stamped as such.
    inputs:
      - name: mask
        semantic_types: [land_cover_prediction, rectified_land_cover, land_cover_labels]
        required: true
    outputs:
      semantic_type: space_cooling_estimate
      data_category: tabular
    params:
      cooling_weights:
        type: object
        default: null
      class_names:
        type: object
        default: null
      space_id:
        type: string
        default: null
      nodata:
        type: integer
        default: 0

  segmenter_disagreement:
    path: metrics/segmenter_disagreement.py
    version: 1.0.0
    description: >
      Map where two categorical masks of the same scene agree and disagree and
      tabulate the confusion. A domain-general ensemble-contestedness detector.
    inputs:
      - name: a
        semantic_types: [land_cover_prediction]
        required: true
      - name: b
        semantic_types: [land_cover_prediction]
        required: true
    outputs:
      semantic_type: disagreement_map
      data_category: raster
    params:
      nodata:
        type: integer
        default: 0
      class_names:
        type: object
        default: null
      summary_path:
        type: string
        default: null

  counterfactual_cooling:
    path: metrics/counterfactual_cooling.py
    version: 1.0.0
    description: >
      The what-if: apply a hypothetical land-cover conversion to a space's
      cooling estimate and re-score, reporting the projected shift. A projection,
      not a promise; the output is stamped as such.
    inputs:
      - name: estimate
        semantic_types: [space_cooling_estimate]
        required: true
    outputs:
      semantic_type: counterfactual_cooling
      data_category: tabular
    params:
      transforms:
        type: array
        default: [{"from": "impervious", "to": "canopy", "fraction": 1.0}]
      space_id:
        type: string
        default: null