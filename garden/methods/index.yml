# ═══════════════════════════════════════════════════════════════════════════════
# garden/methods/index.yml ~ the methods router
#
# The authoritative router from a method id to its file, and nothing else
# (D-216). Orchestrator._resolve_method_path reads it at run time; a run whose
# method id is not here is refused.
#
# A method's name, what it answers and everything else live once, in the
# method file, shaped by seeds/schemas/method.schema.yml (D-213). This file
# repeats none of it, so it cannot drift from the methods.
#
# tests/test_method_schema.py holds this file to garden/methods/: every method
# file is routed exactly once, every route reaches a file, the id here is the
# method's own id, and the domain here is the method's own domain.
#
#   methods:
#     <domain>:
#       - id: <the method's id>
#         path: <file, relative to garden/methods/>
# ═══════════════════════════════════════════════════════════════════════════════

methods:
  information:
    - id: cii_full_method
      path: information/cii_full_method.yml
    - id: cii_indicator_values
      path: information/cii_indicator_values.yml
    - id: county_units_for_mapping
      path: information/county_units_for_mapping.yml
    - id: geography_graph
      path: information/geography_graph.yml
    - id: governance_units_conformed
      path: information/governance_units_conformed.yml
    - id: indicator_values
      path: information/indicator_values.yml
    - id: legislative_seats
      path: information/legislative_seats.yml
    - id: library_carriers
      path: information/library_carriers.yml
    - id: outlet_reconciliation
      path: information/outlet_reconciliation.yml
    - id: ownership_concentration_analysis
      path: information/ownership_concentration_analysis.yml

  perception:
    - id: inverse_perspective_composition
      path: perception/inverse_perspective_composition.yml

  thermal:
    - id: buffer_gradient_analysis
      path: thermal/thermal_gradient_analysis.yml
    - id: hot_cold_spot_analysis
      path: thermal/hot_cold_spot_analysis.yml
    - id: land_cover_cooling_differential
      path: thermal/land_cover_cooling_differential.yml
