# ============================================================================
# garden/methods/information/outlet_carriers.yml
# ============================================================================
# a preparation method (D-98): local news outlets as carriers, placed by
# town and counted in every area their town lies in (Sprint 06, step 3, the
# fifth carrier; WHERE-1). this file is the one home for what is placed and
# why (D-212); the primitives, the run, the crosswalks and the indicator
# point here rather than restate it. ~
# ============================================================================

id: outlet_carriers
domain: information
kind: preparation
name: "Local News Outlets, Placed by Town"
answers_question_types: [outlets, carriers, located_in, preparation]

description: >
  Reads every outlet listing the way its declaration says, groups records
  that share an exact url or name (D-202), and writes each group once, as
  one outlet, in the town its sources give. Each outlet is then placed in
  its town, its county and its state through located_in edges, and counted
  there per 1,000 people.

  Where an outlet is means three things across the listings, and they are
  never compared (D-203). A town a listing names for an outlet (Local News
  Catalyst, the Maine Media Ecosystem file) places it (D-241). When no
  listing names a town, the choice town_fallback says whether the town of
  the publisher's office (Cision) may, by its town name only: never its
  street address, which can sit far from the outlet (Cision puts the
  Advertiser Democrat, a Norway paper, in South Portland), and never
  against a named town, which always wins (D-242). The communities a
  listing says an outlet serves (Jo Easton) are SERVES-1's, unread here.

  One outlet per group (D-243). Its id is made from its members, the first
  by the declaration's source_order, so a fresh copy of one listing
  renumbers no other outlet. Exact keys miss some merges; a person's reading
  of two records as one outlet is a reviewed merge, keyed by each record's
  source and name as written, never by a group id that follows row order.

  A town is matched by name, on both sides alike, after the declared Census
  suffixes come off (Auburn city, Durham town): lowercase, periods and
  apostrophes dropped, a hyphen read as a space. Nothing else is forgiven
  and no abbreviation is expanded (D-244). A named county narrows the match;
  an office county never does, since Cision's reads Cook for Maine outlets
  (D-204). These are rules, each listed with its reason and never placed:
  two different towns for one outlet (towns_disagree); a name matching no
  town, a village included (no_town_match); a name matching two towns with
  no county to choose (ambiguous_town); no town given (no_town_given). A
  person's reading of one outlet's town is a reviewed town, under the same
  keys, and only for an outlet the run would otherwise list.

  A listing's operating status is read through a declared vocabulary
  (D-245): operating, ceased, or quiet (a last post given as a month and
  year, kept with its words and counted). Only Cision's 353-row file
  carries one, a hand-added column whose author and day are not recorded,
  so it is weak evidence. What a ceased outlet becomes is the choice
  ceased_outlets.

  An outlet has no point, so it is placed only where its town decides: its
  town, county and state (D-246). It is never placed in a House or Senate
  district, a Census tribal area or a civil division, since a town can lie
  across several, and no outlet here says which. On the map it is a count
  on its town, never a pin.

requires_data:
  - {name: listings, type: tabular, semantic_types: [outlet_listing], critical: true, as_acquired: true,
     role: "Each source's outlet list, as published or exported, read only as declared.",
     uncertainty_without: "No outlet can be named or placed."}

choices:
  town_fallback:
    options:
      none:
      office_town:
    default: none
    description: >
      Whether an outlet no listing names a town for is placed in the town of
      its publisher's office. none: it is listed as no_town_given and
      counted nowhere, so every count means one thing, a town a listing
      names. office_town: the office's town name places it, flagged
      office_town_not_named, and placed_by says office_town on every such
      outlet. A chain's papers can share one office town, so an office town
      may stand far from the community a paper covers; it is never used
      where a listing names a town.
  ceased_outlets:
    options:
      listed:
      counted:
    default: listed
    description: >
      What an outlet a listing marks ceased becomes. listed: it is named in
      the receipt as ceased and counted nowhere, since counting a closed
      paper would fill a news desert with an outlet that no longer
      publishes. counted: it is placed like any other, flagged
      operating:ceased. Either way the mark is the listing's, whose author
      and day are not recorded.

requires_primitives:
  - soil/stack_outlet_sources
  - soil/group_outlet_records
  - soil/prepare_news_outlets
  - soil/build_town_located_in

produces:
  - semantic_type: news_outlet
    data_category: tabular
    description: Each placed outlet, once, with the town that placed it and how.
  - semantic_type: located_in_edges
    data_category: tabular
    description: Each placed outlet to its town, county and state.

interpretation: >
  A located_in edge says a listing places an outlet in a town, never that
  the outlet covers that town or only that town (SERVES-1). An outlet placed
  by office town says where its publisher's office is. A place with no
  placed outlet is not a place with no news: every outlet not placed is
  listed with its reason, and the listings are commercial and personal
  compilations, not a census of outlets. No outlet is counted in a district
  or a tribal area.
